name: Generate sitemaps

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'scripts/generate_sitemap.py'
      - '*.html'
      - 'robots.txt'
      - '.github/workflows/sitemap.yml'
  schedule:
    - cron: '17 3 * * *'   # opzionale: ogni giorno 03:17 UTC

permissions:
  contents: write   # NECESSARIO per auto-commit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cleanup old sitemaps
        run: |
          rm -f sitemap*.xml sitemap*.xml.gz || true

      - name: Generate sitemaps
        run: |
          python3 --version
          python3 scripts/generate_sitemap.py
          echo "---- generated files ----"
          ls -lah sitemap*.xml* || true

      - name: Auto-commit sitemap files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(sitemap): regenerate"
          file_pattern: |
            sitemap*.xml
            sitemap*.xml.gz
