name: Generate sitemaps

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'scripts/generate_sitemap.py'
      - '*.html'
      - 'robots.txt'
      - '.github/workflows/sitemap.yml'
  schedule:
    - cron: '17 3 * * *'   # opzionale: ogni giorno 03:17 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1) Rimuovi TUTTE le sitemap in root (tracciate + file orfani)
      - name: Remove old root sitemaps
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # elimina file tracciati
          git ls-files -z "sitemap*.xml" "sitemap*.xml.gz" | xargs -0 -r git rm -f

          # elimina eventuali file non tracciati rimasti nella workspace
          rm -f sitemap*.xml sitemap*.xml.gz || true

          # commit della rimozione (se ci sono cambi staged)
          if ! git diff --staged --quiet; then
            git commit -m "chore(sitemap): remove old root sitemaps"
          else
            echo "No tracked root sitemaps to remove."
          fi

      # 2) Genera le nuove sitemap dentro /sitemaps/
      - name: Generate sitemaps (into /sitemaps/)
        run: |
          python3 --version
          python3 scripts/generate_sitemap.py
          echo "---- generated files in /sitemaps ----"
          ls -lah sitemaps || true

      # 3) Commit SOLO della cartella /sitemaps/
      - name: Auto-commit sitemaps folder
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(sitemap): regenerate into /sitemaps/"
          file_pattern: |
            sitemaps/**
