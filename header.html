<header class="amm-topbar" role="banner">
  <style>
    /* ===== AniMMUnity Topbar (scoped) ===== */
    .amm-topbar, .amm-topbar * { box-sizing: border-box; }
    .amm-topbar{
      position: sticky; top: 0; z-index: 1000; width: 100%;
      background:#fff; border-bottom:1px solid #e7e9f1; overflow-x: clip;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* contenitore full-width (come row-x1) */
    .amm-topbar .container.row-x1{
      width:100%; margin:0; padding:10px clamp(14px,3vw,24px);
      display:flex; align-items:center; justify-content:center; gap:12px;
      min-height:56px;
    }

    /* ------ blocco "widget Image" (hamburger + logo) ------ */
    .amm-topbar .widget.Image{
      display:flex; align-items:center; gap:10px; min-width:0;
    }
    .amm-topbar .mobile-menu-toggle{
      width:44px; height:44px; border-radius:12px; display:inline-grid; /* visibile anche in desktop */
      place-items:center; background:#fff; box-shadow: inset 0 0 0 1px #e7e9f1; cursor:pointer;
    }
    .amm-topbar .mobile-menu-toggle::before{
      content:""; width:22px; height:22px; display:block;
      background:
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="%230b1220" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>')
        no-repeat center/contain;
    }
    .amm-topbar .logo-img{ display:inline-flex; align-items:center; gap:10px; }
    .amm-topbar .logo-img img{ height:42px; width:auto; display:block; }
    .amm-topbar #h1-off{ position:absolute; left:-9999px; }

    /* Visually hidden utility (per il checkbox non focalizzabile) */
    .amm-visually-hidden{
      position:absolute !important;
      width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space:nowrap; border:0; left:-9999px;
    }

    /* ===== Drawer (menu laterale) ===== */
    .amm-drawer{
      position:fixed; inset:0 auto 0 0; width:min(86vw,360px);
      background:#fff; border-right:1px solid #e7e9f1;
      transform:translateX(-100%); transition:transform .25s ease; padding:14px; z-index:1001;
    }
    .amm-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:1000;
    }
    /* lo stato open è gestito via JS, non col :checked, per migliore accessibilità */

    .amm-drawer h3{ margin:6px 6px 10px; font:800 14px/1 Inter,system-ui; color:#0b1220; letter-spacing:.04em }
    .amm-list{ display:flex; flex-direction:column; gap:8px; }
    .amm-list a{
      padding:10px 12px; border-radius:10px; text-decoration:none; color:#0b1220;
      font-weight:700; box-shadow: inset 0 0 0 1px #e7e9f1;
    }
    .amm-drawer .social{ margin-top:10px; display:flex; gap:10px }
    .amm-drawer .social a{
      width:36px; height:36px; display:grid; place-items:center; border-radius:10px;
      background:#fff; box-shadow: inset 0 0 0 1px #e7e9f1; color:#0b1220;
    }
    .amm-drawer .social svg{ width:18px; height:18px; }

    /* ===== Responsive ===== */
    @media (max-width: 960px){
      /* hamburger + logo affiancati (uguale al tuo snippet) */
      .amm-topbar .container.row-x1{ justify-content:flex-start; }
      .amm-topbar .logo-img img{ height:38px; }
    }
    @media (max-width: 400px){
      .amm-topbar .logo-img img{ height:34px; }
    }

    /* Stato aperto (aggiunto via JS) */
    .amm-drawer.is-open{ transform:translateX(0) }
    .amm-backdrop.is-open{ opacity:1; pointer-events:auto }
  </style>

  <div class="container row-x1">
    <!-- Checkbox "tecnico" (non focalizzabile) per compatibilità minima -->
    <input type="checkbox" id="amm-open" class="amm-visually-hidden" tabindex="-1">

    <!-- 🔻 Markup hamburger + logo (come richiesto) -->
    <div class="widget Image" data-version="2" id="Image121">
      <a class="mobile-menu-toggle" href="javascript:;" role="button" title="Menu"
         aria-controls="amm-drawer" aria-expanded="false"></a>
      <a class="logo-img custom-image" href="/">
        <img alt="AniMMunity" id="Image121_img"
             src="https://blogger.googleusercontent.com/img/a/AVvXsEiR3-hYSCn56AYoM6Tqode6VRp431p_u_t12SPPOgX-FmM2AR2m0CwSMdmJJbVNfE3USmRm-B_XnBfSdjIYvNATG8BxYDVwXjIniPr3RZbV860Ejwai4f6p0Gi0Dd7zFU9SfXQkCf9BlsOpOEjrGoNG5QFxi-2LVj6njD7QSsIWv5uxmWnU3dWQH-VKcAA=s500">
        <h1 id="h1-off">AniMMunity</h1>
      </a>
    </div>
  </div>

  <!-- Drawer: link “topbar” + social -->
  <aside class="amm-drawer" id="amm-drawer" aria-label="Mobile menu" tabindex="-1">
    <h3>Topbar Menu</h3>
    <nav class="amm-list">
      <a href="https://animmunity.blogspot.com/p/about-us.html">About Us</a>
      <a href="https://animmunity.blogspot.com/p/privacy-policy.html">Privacy Policy</a>
      <a href="https://animmunity.blogspot.com/p/contact-us.html">Contact Us</a>
    </nav>
    <h3>Follow</h3>
    <div class="social">
      <a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="facebook">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0b1220" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
      </a>
      <a href="https://twitter.com/" target="_blank" rel="noopener" aria-label="x-twitter">
        <svg viewBox="0 0 24 24" fill="#0b1220"><path d="M18.244 2H21l-6.56 7.49L22 22h-5.9l-4.6-6.01L5.2 22H2l7.03-8.02L2 2h6l4.04 5.35L18.244 2Zm-1.03 18h1.58L8.86 4h-1.6l9.95 16Z"/></svg>
      </a>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="youtube">
        <svg viewBox="0 0 24 24" fill="#0b1220"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.3 3.5 12 3.5 12 3.5s-7.3 0-9.4.6A3 3 0 0 0 .5 6.2 31.1 31.1 0 0 0 0 12a31.1 31.1 0 0 0 .6 5.8 3 3 0 0 0 2.1 2.1C4.8 20.5 12 20.5 12 20.5s7.3 0 9.4-.6a3 3 0 0 0 2.1-2.1c.4-1.9.6-3.9.6-5.8s-.2-3.9-.6-5.8ZM9.7 15.5v-7l6 3.5-6 3.5Z"/></svg>

      <a href="https://animmunity.blogspot.com/feeds/posts/default" target="_blank" rel="noopener" aria-label="rss">
        <svg viewBox="0 0 24 24" fill="#0b1220"><path d="M6.18 17.82a2.18 2.18 0 1 1-4.36 0 2.18 2.18 0 0 1 4.36 0ZM0 10.91v3.27a9.82 9.82 0 0 1 9.82 9.82h3.27C13.09 17.34 6.66 10.91 0 10.91Zm0-6.55v3.27A16.36 16.36 0 0 1 16.36 24h3.27C19.64 13.37 10.63 4.36 0 4.36Z"/></svg>
      </a>
    </div>
  </aside>
  <div class="amm-backdrop" aria-hidden="true"></div>

  <script>
    (function(){
      const root = document.currentScript.closest('.amm-topbar');
      const toggle = root.querySelector('.mobile-menu-toggle');
      const drawer = root.querySelector('#amm-drawer');
      const backdrop = root.querySelector('.amm-backdrop');
      const main = document.querySelector('main');

      function open(){
        drawer.classList.add('is-open');
        backdrop.classList.add('is-open');
        toggle.setAttribute('aria-expanded','true');
        drawer.setAttribute('aria-modal','true');
        if(main) main.setAttribute('inert','');

        // focus al primo elemento interattivo del drawer
        const first = drawer.querySelector('a, button, input, [tabindex]:not([tabindex="-1"])');
        (first || drawer).focus({preventScroll:true});
      }
      function close(){
        drawer.classList.remove('is-open');
        backdrop.classList.remove('is-open');
        toggle.setAttribute('aria-expanded','false');
        drawer.removeAttribute('aria-modal');
        if(main) main.removeAttribute('inert');

        toggle.focus({preventScroll:true});
      }

      toggle.addEventListener('click', (e)=>{ e.preventDefault(); 
        drawer.classList.contains('is-open') ? close() : open();
      });
      backdrop.addEventListener('click', close);
      drawer.addEventListener('click', (e)=>{ if(e.target.closest('a')) close(); });
      document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && drawer.classList.contains('is-open')) close(); });
    })();
  </script>
</header>
