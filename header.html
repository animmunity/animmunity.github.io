<header class="amm-topbar" role="banner">
  <style>
    /* ===== AniMMUnity Topbar (flex, white) ===== */
    .amm-topbar, .amm-topbar * { box-sizing: border-box; }
    .amm-topbar{
      position: sticky; top: 0; z-index: 1000; width: 100%;
      background:#fff; border-bottom:1px solid #e7e9f1;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Barra: solo flex, niente grid */
    .amm-bar{
      position: relative;
      display:flex; align-items:center; justify-content:space-between;
      width:100%; padding:10px clamp(14px,3vw,24px); min-height:56px;
    }

    /* Hamburger (sempre visibile) */
    .mobile-menu-toggle{
      -webkit-appearance:none; appearance:none;
      width:44px; height:44px; border-radius:12px; border:0;
      display:inline-flex; align-items:center; justify-content:center;
      background:#fff; box-shadow: inset 0 0 0 1px #e7e9f1; cursor:pointer;
    }
    .mobile-menu-toggle:active{ transform: translateY(1px); }
    .mobile-menu-toggle svg{ width:22px; height:22px; stroke:#0b1220; stroke-width:2; fill:none; }

    /* Logo SEMPRE centrato */
    .logo-wrap{
      position:absolute; left:50%; transform: translateX(-50%);
      display:flex; align-items:center; justify-content:center;
      pointer-events:auto;  /* cliccabile */
    }
    .logo-img{ display:inline-flex; align-items:center; gap:10px; text-decoration:none; }
    .logo-img img{ height:42px; width:auto; display:block; }
    #h1-off{ position:absolute; left:-9999px; }

    /* Spacer a destra per bilanciare la larghezza del burger (centro perfetto) */
    .amm-spacer{ width:44px; height:44px; }

    /* Drawer laterale */
    .amm-drawer{
      position:fixed; inset:0 auto 0 0; width:min(86vw,360px);
      background:#fff; border-right:1px solid #e7e9f1;
      transform:translateX(-100%); transition:transform .25s ease; padding:14px; z-index:1001;
      outline: none;
    }
    .amm-drawer.is-open{ transform:translateX(0); }

    .amm-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:1000;
    }
    .amm-backdrop.is-open{ opacity:1; pointer-events:auto; }

    .amm-drawer h3{ margin:6px 6px 10px; font:800 14px/1 Inter,system-ui; color:#0b1220; letter-spacing:.04em }
    .amm-list{ display:flex; flex-direction:column; gap:8px; }
    .amm-list a{
      padding:10px 12px; border-radius:10px; text-decoration:none; color:#0b1220;
      font-weight:700; box-shadow: inset 0 0 0 1px #e7e9f1;
    }
    .amm-drawer .social{ margin-top:10px; display:flex; gap:10px }
    .amm-drawer .social a{
      width:36px; height:36px; display:grid; place-items:center; border-radius:10px;
      background:#fff; box-shadow: inset 0 0 0 1px #e7e9f1; color:#0b1220;
    }
    .amm-drawer .social svg{ width:18px; height:18px; }

    /* Responsive piccoli aggiustamenti */
    @media (max-width: 960px){ .logo-img img{ height:38px; } }
    @media (max-width: 400px){ .logo-img img{ height:34px; } }
  </style>

  <!-- Barra superiore: [hamburger] [logo centrato assoluto] [spacer] -->
  <div class="amm-bar">
    <button class="mobile-menu-toggle" type="button" aria-controls="amm-drawer" aria-expanded="false" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <div class="logo-wrap">
      <a class="logo-img custom-image" href="/">
        <img alt="AniMMunity" id="Image121_img"
             src="https://blogger.googleusercontent.com/img/a/AVvXsEiR3-hYSCn56AYoM6Tqode6VRp431p_u_t12SPPOgX-FmM2AR2m0CwSMdmJJbVNfE3USmRm-B_XnBfSdjIYvNATG8BxYDVwXjIniPr3RZbV860Ejwai4f6p0Gi0Dd7zFU9SfXQkCf9BlsOpOEjrGoNG5QFxi-2LVj6njD7QSsIWv5uxmWnU3dWQH-VKcAA=s500">
        <h1 id="h1-off">AniMMunity</h1>
      </a>
    </div>

    <span class="amm-spacer" aria-hidden="true"></span>
  </div>

  <!-- Drawer con le stesse voci del tuo “next-pro-main-nav-menu” -->
  <aside class="amm-drawer" id="amm-drawer" aria-label="Mobile menu" tabindex="-1">
    <h3>Menu</h3>
    <nav class="amm-list" role="menubar">
      <a href="https://animmunity.blogspot.com/" role="menuitem">Home</a>
      <a href="https://animmunity.github.io/anime-list.html" role="menuitem">Anime List</a>

      <a href="https://animmunity.github.io/character-list.html" role="menuitem">Characters</a>

    <h3>Follow</h3>
    <div class="social">
      <a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="facebook">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0b1220" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>

    </div>
  </aside>
  <div class="amm-backdrop" aria-hidden="true"></div>

  <script>
    (function(){
      const header   = document.querySelector('.amm-topbar');
      const toggle   = header.querySelector('.mobile-menu-toggle');
      const drawer   = header.querySelector('#amm-drawer');
      const backdrop = header.querySelector('.amm-backdrop');
      const main     = document.querySelector('main');

      function openDrawer(){
        drawer.classList.add('is-open');
        backdrop.classList.add('is-open');
        toggle.setAttribute('aria-expanded','true');
        drawer.setAttribute('aria-modal','true');
        if (main) main.setAttribute('inert','');
        const first = drawer.querySelector('a, button, input, [tabindex]:not([tabindex="-1"])');
        (first || drawer).focus({preventScroll:true});
      }
      function closeDrawer(){
        drawer.classList.remove('is-open');
        backdrop.classList.remove('is-open');
        toggle.setAttribute('aria-expanded','false');
        drawer.removeAttribute('aria-modal');
        if (main) main.removeAttribute('inert');
        toggle.focus({preventScroll:true});
      }

      toggle.addEventListener('click', (e)=>{ e.preventDefault();
        (drawer.classList.contains('is-open') ? closeDrawer : openDrawer)();
      });
      backdrop.addEventListener('click', closeDrawer);
      drawer.addEventListener('click', (e)=>{ if (e.target.closest('a')) closeDrawer(); });
      document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' && drawer.classList.contains('is-open')) closeDrawer(); });
    })();
  </script>
</header>
