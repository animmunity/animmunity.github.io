<header class="amw-header" role="banner">
  <style>
    /* ===== AniMMUnity — White Header (scoped, no-JS) ===== */
    .amw-header, .amw-header * { box-sizing: border-box; }
    .amw-header{
      position: sticky; top: 0; z-index: 1000; width: 100%;
      background: #ffffff; border-bottom: 1px solid #e7e9f1;
      overflow-x: clip; /* evita dentino in mobile */
    }

    .amw-container{
      max-width: 1200px; margin: 0 auto;
      padding: 10px max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left));
      display: grid; align-items: center;
      grid-template-columns: 44px 1fr 44px; gap: 12px;
    }

    /* Hamburger (checkbox + label → no JS) */
    #amw-menu{ position: absolute; left: -9999px; }
    .amw-hamb{
      width:44px; height:44px; border-radius:12px; cursor:pointer;
      display:grid; place-items:center; background:#fff;
      box-shadow: inset 0 0 0 1px #e7e9f1;
    }
    .amw-hamb svg{ width:22px; height:22px; stroke:#0b1220; stroke-width:2; fill:none; }

    /* Brand centrato */
    .amw-brand{
      justify-self: center; min-width:0; display:inline-flex; align-items:center;
    }
    .amw-brand img{ height:40px; width:auto; max-width:100%; display:block; }

    /* Icona search (link) */
    .amw-search{
      width:44px; height:44px; border-radius:12px; display:grid; place-items:center;
      background:#fff; box-shadow: inset 0 0 0 1px #e7e9f1;
    }
    .amw-search svg{ width:20px; height:20px; stroke:#0b1220; stroke-width:2; fill:none; }

    /* Drawer laterale (mobile) + backdrop */
    .amw-drawer{
      position:fixed; inset:0 auto 0 0; width:min(86vw, 360px); max-width:100%;
      background:#fff; border-right:1px solid #e7e9f1;
      transform: translateX(-100%); transition: transform .25s ease; will-change: transform;
      padding: 14px;
    }
    .amw-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      opacity:0; pointer-events:none; transition: opacity .2s ease;
    }
    /* Toggle stato aperto */
    #amw-menu:checked ~ .amw-drawer{ transform: translateX(0); }
    #amw-menu:checked ~ .amw-backdrop{ opacity:1; pointer-events:auto; }

    /* Nav (desktop) */
    .amw-nav{
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
      justify-content:center; /* centrato sotto al logo (desktop) */
    }
    .amw-link{
      padding:8px 14px; border-radius:10px; background:#fff;
      box-shadow: inset 0 0 0 1px #e7e9f1;
      font: 600 14px/1.1 Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#0b1220; text-decoration:none; white-space:nowrap;
    }
    .amw-link:hover{ box-shadow: inset 0 0 0 1px #cfd4e6; }

    /* Contenuto drawer */
    .amw-drawer h3{ margin:4px 6px 10px; font:800 14px/1 Inter,system-ui; color:#0b1220; letter-spacing:.04em; }
    .amw-drawer .amw-list{ display:flex; flex-direction:column; gap:8px; }
    .amw-drawer .amw-list a{ padding:10px 12px; border-radius:10px; box-shadow: inset 0 0 0 1px #e7e9f1; color:#0b1220; text-decoration:none; font-weight:600; }

    /* Layout desktop: nav visibile in header */
    @media (min-width: 960px){
      .amw-container{ grid-template-columns: 1fr auto 1fr; }
      .amw-hamb{ display:none; }
      .amw-search{ justify-self:end; }
      .amw-drawer, .amw-backdrop{ display:none; }
      .amw-nav{ position:relative; }
    }

    /* Logo più compatto su mobile */
    @media (max-width: 400px){
      .amw-brand img{ height:34px; }
    }
  </style>

  <div class="amw-container">
    <!-- Toggle -->
    <input type="checkbox" id="amw-menu" aria-hidden="true">

</header>
