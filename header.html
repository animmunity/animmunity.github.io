<header class="amm-topbar" role="banner">
  <style>
    /* ===== AniMMUnity Topbar (scoped, white, no-JS) ===== */
    .amm-topbar, .amm-topbar * { box-sizing: border-box; }
    .amm-topbar{
      position: sticky; top: 0; z-index: 1000; width: 100%;
      background:#fff; border-bottom:1px solid #e7e9f1;
      overflow-x: clip;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .amm-wrap{
      max-width:1200px; margin:0 auto;
      padding:10px max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left));
      display:grid; align-items:center; gap:12px;
      /* desktop: menu | logo | social  */
      grid-template-columns: 1fr auto 1fr;
    }

    /* — Brand (centrato) — */
    .amm-brand{ justify-self:center; display:inline-flex; align-items:center; min-width:0 }
    .amm-brand img{ height:42px; width:auto; max-width:100%; display:block }

    /* — Menu left — */
    .amm-menu{ display:flex; align-items:center; gap:14px; flex-wrap:wrap }
    .amm-menu a{
      color:#0b1220; text-decoration:none; font-weight:600; font-size:14px;
      padding:8px 10px; border-radius:10px; background:#fff;
      box-shadow: inset 0 0 0 1px #e7e9f1;
    }
    .amm-menu a:hover{ box-shadow: inset 0 0 0 1px #cfd4e6; }

    /* — Social right — */
    .amm-social{ display:flex; justify-content:flex-end; gap:10px; }
    .amm-social a{
      width:36px; height:36px; display:grid; place-items:center;
      border-radius:10px; background:#fff; color:#0b1220;
      box-shadow: inset 0 0 0 1px #e7e9f1;
    }
    .amm-social svg{ width:18px; height:18px; }

    /* ===== Mobile / Tablet ===== */
    #amm-open{ position:absolute; left:-9999px; }
    .amm-hamb{
      display:none; width:44px; height:44px; border-radius:12px;
      background:#fff; box-shadow: inset 0 0 0 1px #e7e9f1;
      align-items:center; justify-content:center; cursor:pointer;
    }
    .amm-hamb svg{ width:22px; height:22px; stroke:#0b1220; stroke-width:2; fill:none; }

    /* Drawer + backdrop */
    .amm-drawer{
      position:fixed; inset:0 auto 0 0; width:min(86vw,360px);
      background:#fff; border-right:1px solid #e7e9f1;
      transform:translateX(-100%); transition:transform .25s ease; padding:14px;
    }
    .amm-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      opacity:0; pointer-events:none; transition:opacity .2s ease;
    }
    #amm-open:checked ~ .amm-drawer{ transform:translateX(0) }
    #amm-open:checked ~ .amm-backdrop{ opacity:1; pointer-events:auto }

    .amm-drawer h3{ margin:6px 6px 10px; font:800 14px/1 Inter,system-ui; color:#0b1220; letter-spacing:.04em }
    .amm-list{ display:flex; flex-direction:column; gap:8px; }
    .amm-list a{
      padding:10px 12px; border-radius:10px; text-decoration:none; color:#0b1220;
      font-weight:600; box-shadow: inset 0 0 0 1px #e7e9f1;
    }
    .amm-drawer .social{ margin-top:10px; display:flex; gap:10px }

    @media (max-width: 960px){
      /* header a 3 colonne: [hamb] [logo] [spazio]  */
      .amm-wrap{
        grid-template-columns: 44px 1fr 44px;
      }
      .amm-hamb{ display:flex; }
      .amm-menu, .amm-social{ display:none; }
      .amm-brand{ justify-self:center }
      .amm-brand img{ height:38px }
    }
    @media (max-width: 400px){
      .amm-brand img{ height:34px }
    }
  </style>

  <div class="amm-wrap">
    <!-- Hamburger (a sinistra, mobile) -->
    <input type="checkbox" id="amm-open" aria-hidden="true">
    <label class="amm-hamb" for="amm-open" aria-label="Open menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </label>

    <!-- Logo centrale -->

    </a>
