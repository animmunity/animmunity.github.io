<header class="amm-topbar" role="banner">
  <style>
    /* ===== AniMMUnity Topbar (flex, white, CSS-only) ===== */
    .amm-topbar, .amm-topbar * { box-sizing: border-box; }
    .amm-topbar{
      position: sticky; top: 0; z-index: 1000; width: 100%;
      background:#fff; border-bottom:1px solid #e7e9f1;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Visually hidden (per il checkbox stato) */
    .sr-only{
      position:absolute !important; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space:nowrap; border:0;
    }

    /* Barra: [hamburger] [logo centrato] [spacer] */
    .amm-bar{
      position: relative;
      display:flex; align-items:center; justify-content:space-between;
      width:100%; padding:10px clamp(14px,3vw,24px); min-height:56px;
    }

    /* Hamburger (sempre visibile) — usa <label for="#amm-open"> */
    .mobile-menu-toggle{
      flex: 0 0 44px; width:44px; height:44px; border-radius:12px; display:inline-flex;
      align-items:center; justify-content:center; cursor:pointer;
      background:#fff; box-shadow: inset 0 0 0 1px #e7e9f1;
      user-select:none;
    }
    .mobile-menu-toggle:active{ transform: translateY(1px); }
    .mobile-menu-toggle svg{ width:22px; height:22px; stroke:#0b1220; stroke-width:2; fill:none; }

    /* Logo SEMPRE centrato con anti-overlap */
    .logo-wrap{
      position:absolute; left:50%; transform: translateX(-50%);
      display:flex; align-items:center; justify-content:center;
      max-width: calc(100% - 120px); /* 44 (hamb) + 44 (spacer) + padding */
      text-align:center;
    }
    .logo-img{ display:inline-flex; align-items:center; gap:10px; max-width:100%; min-width:0; text-decoration:none; }
    .logo-img img{
      display:block; max-width:100%; height:auto; max-height:42px; /* desktop */
    }
    #h1-off{ position:absolute; left:-9999px; }
    .amm-spacer{ flex:0 0 44px; width:44px; height:44px; }

    /* Drawer laterale (apre/chiude via :checked) */
    .amm-drawer{
      position:fixed; inset:0 auto 0 0; width:min(86vw,360px);
      background:#fff; border-right:1px solid #e7e9f1;
      transform:translateX(-100%); transition:transform .25s ease; padding:14px; z-index:1001;
      overflow:auto;
    }
    .amm-drawer h3{ margin:6px 6px 10px; font:800 14px/1 Inter,system-ui; color:#0b1220; letter-spacing:.04em }
    .amm-list{ display:flex; flex-direction:column; gap:8px; }
    .amm-list a{
      padding:10px 12px; border-radius:10px; text-decoration:none; color:#0b1220;
      font-weight:700; box-shadow: inset 0 0 0 1px #e7e9f1;
    }

    /* Pulsante chiudi nel drawer */
    .amm-close{
      width:40px; height:40px; border-radius:10px; display:inline-flex;
      align-items:center; justify-content:center; cursor:pointer;
      background:#fff; box-shadow: inset 0 0 0 1px #e7e9f1; margin:0 0 8px 2px;
    }
    .amm-close svg{ width:18px; height:18px; }

    /* Backdrop come <label> per chiudere al click */
    .amm-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:1000;
    }

    /* Stato aperto con :checked */
    #amm-open:checked ~ .amm-drawer{ transform:translateX(0) }
    #amm-open:checked ~ .amm-backdrop{ opacity:1; pointer-events:auto }

    /* Responsive: SOLO dimensione logo aggiornata */
    @media (max-width: 960px){ .logo-img img{ max-height: 36px; } }
    @media (max-width: 400px){ .logo-img img{ max-height: 30px; } }
  </style>

  <!-- Checkbox di stato (CSS-only) -->
  <input type="checkbox" id="amm-open" class="sr-only">

  <!-- Barra superiore -->
  <div class="amm-bar">
    <!-- Toggle apre/chiude il drawer -->
    <label class="mobile-menu-toggle" for="amm-open" role="button" aria-controls="amm-drawer" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </label>

    <!-- Logo nero centrato -->
    <div class="logo-wrap">
      <a class="logo-img custom-image" href="/">
        <img alt="AniMMunity" id="Image121_img"
             src="https://blogger.googleusercontent.com/img/a/AVvXsEiR3-hYSCn56AYoM6Tqode6VRp431p_u_t12SPPOgX-FmM2AR2m0CwSMdmJJbVNfE3USmRm-B_XnBfSdjIYvNATG8BxYDVwXjIniPr3RZbV860Ejwai4f6p0Gi0Dd7zFU9SfXQkCf9BlsOpOEjrGoNG5QFxi-2LVj6njD7QSsIWv5uxmWnU3dWQH-VKcAA=s500">
        <h1 id="h1-off">AniMMunity</h1>
      </a>
    </div>

    <!-- Spacer a destra per bilanciare l'hamburger -->
    <span class="amm-spacer" aria-hidden="true"></span>
  </div>

  <!-- Drawer: submenu richiesto -->
  <aside class="amm-drawer" id="amm-drawer" aria-label="Mobile menu">
    <!-- Close (senza JS) -->
    <label for="amm-open" class="amm-close" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b1220" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </label>

    <h3>Menu</h3>
    <nav class="amm-list" role="menubar">
      <a href="https://animmunity.github.io/" role="menuitem">Home</a>
      <a href="https://animmunity.blogspot.com/" role="menuitem">Magazine</a>
      <a href="https://animmunity.github.io/anime-list.html" role="menuitem">Anime List</a>
      <a href="https://animmunity.github.io/top-anime.html" role="menuitem">Top Anime</a>
      <a href="https://animmunity.github.io/manga-list.html" role="menuitem">Manga List</a>
      <a href="https://animmunity.github.io/top-manga.html" role="menuitem">Top Manga</a>
      <a href="https://animmunity.github.io/character-list.html" role="menuitem">Characters</a>
      <a href="https://animmunity.github.io/anime-themes.html" role="menuitem">Themes</a>
    </nav>
  </aside>

  <!-- Backdrop: cliccandolo chiudi il menu -->
  <label class="amm-backdrop" for="amm-open" aria-hidden="true"></label>
</header>
