<header class="amx-subheader" role="banner">
  <style>
    /* ===== Submenu bianco (scoped) ===== */
    .amx-subheader, .amx-subheader * { box-sizing: border-box; }
    .amx-subheader{
      position: sticky; top: 0; z-index: 1000; width: 100%;
      background:#ffffff; border-bottom:1px solid #e7e9f1; overflow-x: clip;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Full-width container */
    .amx-subheader .container.row-x1{
      width:100%; margin:0; padding:10px clamp(14px, 3vw, 24px);
    }

    /* Riga principale: left (hamburger+logo+menu) | right (search button) */
    .amx-subheader .header-items{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      min-height:56px;
    }
    .flex-left{ display:flex; align-items:center; gap:16px; min-width:0; }
    .flex-right{ display:flex; align-items:center; gap:10px; }

    /* ===== Hamburger + Logo (come tuo markup) ===== */
    .next-mobile-logo-section .mobile-menu-toggle{
      width:44px; height:44px; border-radius:12px; display:inline-grid; place-items:center;
      background:#fff; box-shadow: inset 0 0 0 1px #e7e9f1; cursor:pointer; margin-right:8px;
    }
    .next-mobile-logo-section .mobile-menu-toggle::before{
      content:""; width:22px; height:22px; display:block;
      background:
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="%230b1220" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>')
        no-repeat center/contain;
    }
    .main-logo .logo-img{ display:inline-flex; align-items:center; gap:10px; }
    .main-logo .logo-img img{ height:40px; width:auto; display:block; }
    .main-logo #h1-off{ position:absolute; left:-9999px; }

    /* ===== Menu desktop (uguale alle tue classi) ===== */
    .next-pro-main-nav .show-menu > a.mobile-menu-toggle{ display:none; } /* nasconde toggle extra in desktop */
    #next-pro-main-nav-menu{
      list-style:none; margin:0; padding:0; display:flex; gap:12px; flex-wrap:wrap;
    }
    #next-pro-main-nav-menu > li{ margin:0; padding:0; }
    #next-pro-main-nav-menu > li > a{
      display:inline-block; padding:8px 12px; border-radius:10px; text-decoration:none;
      color:#0b1220; font-weight:700; font-size:14px; letter-spacing:.02em; background:#fff;
      box-shadow: inset 0 0 0 1px #e7e9f1;
    }
    #next-pro-main-nav-menu > li > a:hover{ box-shadow: inset 0 0 0 1px #cfd4e6; }

    /* ===== Bottone search a destra + area search a comparsa ===== */
    .main-toggle-wrap .main-toggle-style{
      width:44px; height:44px; border-radius:12px; display:inline-grid; place-items:center;
      background:#fff; box-shadow: inset 0 0 0 1px #e7e9f1; cursor:pointer;
    }
    .main-toggle-wrap .show-search::before{
      content:""; width:20px; height:20px; display:block;
      background:
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%230b1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>')
        no-repeat center/contain;
    }
    .main-toggle-style.hide-search::before{
      content:""; width:20px; height:20px; display:block;
      background:
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%230b1220" stroke-width="2" stroke-linecap="round"><path d="M6 18L18 6M6 6l12 12"/></svg>')
        no-repeat center/contain;
    }

    #main-search-wrap{ overflow:hidden; max-height:0; transition:max-height .25s ease; }
    #main-search-wrap.open{ max-height:86px; }
    #main-search-wrap .main-search{
      display:flex; align-items:center; gap:10px; padding:10px 0;
    }
    .search-form{ flex:1; }
    .search-input{
      width:100%; height:44px; padding:0 12px; border-radius:12px; border:1px solid #e7e9f1;
      font-size:16px; outline:none;
    }
    .search-input:focus{ border-color:#bfd7ff; box-shadow: 0 0 0 3px #e6f0ff; }

    /* ===== Drawer mobile full-screen (solo submenu) ===== */
    .amx-drawer{
      position:fixed; left:0; right:0; top:var(--amx-top, 60px);
      background:#fff; border-bottom:1px solid #e7e9f1;
      transform:translateY(-100%); transition:transform .25s ease; z-index: 999;
      padding:12px clamp(14px, 3vw, 24px) 16px;
    }
    .amx-drawer.open{ transform:translateY(0); }
    .amx-drawer .drawer-nav{
      list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;
    }
    .amx-drawer .drawer-nav a{
      display:block; padding:12px; border-radius:12px; text-decoration:none; color:#0b1220; font-weight:700;
      box-shadow: inset 0 0 0 1px #e7e9f1;
    }
    .amx-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      opacity:0; pointer-events:none; transition: opacity .2s ease; z-index: 998;
    }
    .amx-backdrop.open{ opacity:1; pointer-events:auto; }

    /* ===== Responsive ===== */
    @media (max-width: 960px){
      .next-pro-main-nav{ display:none; }     /* menu orizzontale nascosto in mobile */
      .main-logo .logo-img img{ height:36px; }
      .next-mobile-logo-section .mobile-menu-toggle{ display:inline-grid; }
    }
  </style>

  <!-- ===== SUBMENU (uguale al tuo) ===== -->
  <div class="container row-x1">
    <div class="header-items">
      <div class="flex-left">
        <div class="next-mobile-logo-section main-logo section" id="next-mobile-logo-section" name="Mobile Logo Section">
          <div class="widget Image" data-version="2" id="Image121">
            <a class="mobile-menu-toggle" href="javascript:;" role="button" title="Menu" aria-controls="amx-drawer" aria-expanded="false"></a>
            <a class="logo-img custom-image" href="/">
              <img alt="AniMMunity" id="Image121_img" src="https://blogger.googleusercontent.com/img/a/AVvXsEhxDE9GIj2qFHrjNIPUkbVn-S8Ii8KepIyQ_LiRWikFLgWIRRvNqjMiSJk3Wx8GTUy8ih6VLcFxF8d65jYpQBrSQnizbaIS_SlatSD2HOvUfy4ZH279Wb0gBkKbD3sXOvqeTL2J-II4UQdCVyXlSMBPIUmQlrP-xAxtfgYmQ-FOZuoyBgpksGTx3_0YPRE=s500">
              <h1 id="h1-off">AniMMunity</h1>
            </a>
          </div>
        </div>

        <div class="next-pro-main-nav section" id="next-pro-main-nav" name="Header Menu">
          <div class="widget LinkList show-menu" data-version="2" id="LinkList101">
            <a class="mobile-menu-toggle" href="javascript:;" role="button" title="Menu"></a>
            <ul id="next-pro-main-nav-menu" role="menubar">
              <li><a href="https://animmunity.blogspot.com/" role="menuitem">Home</a></li>
              <li><a href="https://animmunity.github.io/anime-list.html" role="menuitem">Anime List</a></li>
              <li><a href="https://animmunity.github.io/top-anime.html" role="menuitem">Top Anime</a></li>
              <li><a href="https://animmunity.github.io/manga-list.html" role="menuitem">Manga List</a></li>
              <li><a href="https://animmunity.github.io/top-manga.html" role="menuitem">Top Manga</a></li>
              <li><a href="https://animmunity.github.io/character-list.html" role="menuitem">Characters</a></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="flex-right">
        <div class="main-toggle-wrap">
          <a class="main-toggle-style show-search" href="javascript:;" role="button" aria-controls="main-search-wrap" aria-expanded="false" title="Search"></a>
        </div>
      </div>
    </div>

    <!-- SEARCH slide-down -->
    <div id="main-search-wrap" aria-hidden="true">
      <div class="main-search">
        <form action="https://animmunity.blogspot.com/search" class="search-form" role="search">
          <input autocomplete="off" class="search-input" name="q" placeholder="Search" type="search" value="">
        </form>
        <a class="main-toggle-style hide-search" href="javascript:;" role="button" aria-controls="main-search-wrap" aria-expanded="true" title="Close search"></a>
      </div>
    </div>
  </div>

  <!-- Drawer mobile con lo stesso menu -->
  <aside id="amx-drawer" class="amx-drawer" aria-label="Mobile menu">
    <nav>
      <ul class="drawer-nav" role="menubar">
        <li><a href="https://animmunity.blogspot.com/" role="menuitem">Home</a></li>
        <li><a href="https://animmunity.github.io/anime-list.html" role="menuitem">Anime List</a></li>
        <li><a href="https://animmunity.github.io/top-anime.html" role="menuitem">Top Anime</a></li>
        <li><a href="https://animmunity.github.io/manga-list.html" role="menuitem">Manga List</a></li>
        <li><a href="https://animmunity.github.io/top-manga.html" role="menuitem">Top Manga</a></li>
        <li><a href="https://animmunity.github.io/character-list.html" role="menuitem">Characters</a></li>
      </ul>
    </nav>
  </aside>
  <div class="amx-backdrop" id="amx-backdrop" aria-hidden="true"></div>

  <script>
    // Micro JS per drawer e search (scoped)
    (function(){
      const root = document.currentScript.closest('.amx-subheader');
      const burger = root.querySelector('.next-mobile-logo-section .mobile-menu-toggle');
      const drawer = root.querySelector('#amx-drawer');
      const backdrop = root.querySelector('#amx-backdrop');

      const searchWrap = root.querySelector('#main-search-wrap');
      const showSearch = root.querySelector('.main-toggle-style.show-search');
      const hideSearch = root.querySelector('.main-toggle-style.hide-search');

      // Posiziona il drawer subito sotto l’header
      const setDrawerTop = () => drawer.style.setProperty('--amx-top', root.offsetHeight + 'px');
      setDrawerTop();
      window.addEventListener('resize', setDrawerTop);

      function openDrawer(){
        drawer.classList.add('open'); backdrop.classList.add('open');
        burger.setAttribute('aria-expanded','true');
      }
      function closeDrawer(){
        drawer.classList.remove('open'); backdrop.classList.remove('open');
        burger.setAttribute('aria-expanded','false');
      }
      burger.addEventListener('click', (e)=>{ e.preventDefault(); drawer.classList.contains('open')? closeDrawer(): openDrawer(); });
      backdrop.addEventListener('click', closeDrawer);
      drawer.addEventListener('click', (e)=>{ if(e.target.closest('a')) closeDrawer(); });

      // Search
      function openSearch(){ searchWrap.classList.add('open'); searchWrap.setAttribute('aria-hidden','false'); showSearch.setAttribute('aria-expanded','true'); searchWrap.querySelector('.search-input')?.focus(); }
      function closeSearch(){ searchWrap.classList.remove('open'); searchWrap.setAttribute('aria-hidden','true'); showSearch.setAttribute('aria-expanded','false'); }
      showSearch.addEventListener('click', (e)=>{ e.preventDefault(); openSearch(); });
      hideSearch.addEventListener('click', (e)=>{ e.preventDefault(); closeSearch(); });
    })();
  </script>
</header>
