<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Anime Detail — AniMMUnity</title>
  <meta name="description" content="Anime detail page with trailer, information, studios, genres and full metadata on AniMMUnity.">

  <!-- Robots -->
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

  <!-- Theme color -->
  <meta name="theme-color" content="#ffffff">

  <!-- Open Graph / Twitter (filled via JS) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AniMMUnity">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="">
  <link id="canonicalLink" rel="canonical" href="">

  <!-- JSON-LD placeholders -->
  <script id="ld-breadcrumbs" type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[]}</script>
  <script id="ld-entity" type="application/ld+json">{"@context":"https://schema.org","@type":"CreativeWork"}</script>

  <!-- Assets -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>

  <!-- 🔌 Preconnect per YouTube (nocookie) e thumbnail -->
  <link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin>
  <link rel="preconnect" href="https://i.ytimg.com">
  
  <!-- (facoltativo) DNS-prefetch -->
  <link rel="dns-prefetch" href="//www.youtube-nocookie.com">
  <link rel="dns-prefetch" href="//i.ytimg.com">
  
  <!-- 🚀 Preload del CSV (usa percorso assoluto per sicurezza) -->
  <link rel="preload" href="/data/anime.csv" as="fetch" type="text/csv">

<style>
  /* =====================
     NOVA WHITE UI — Fresh, airy, tactile
     (JS invariato, markup aggiornato)
     ===================== */
  :root{
    /* Palette */
    --bg: #f6f7fb;              /* sfondo pagina chiaro */
    --ink: #0f172a;             /* testo principale */
    --muted: #5b6478;           /* testo attenuato */
    --panel: #ffffff;           /* superfici */
    --soft: #f0f2f8;            /* superfici secondarie */
    --border: #e6e9f2;          /* bordi */
    --primary: #4f46e5;         /* indaco */
    --primary-ink: #3532b3;
    --accent: #06b6d4;          /* ciano */
    --success: #16a34a;         /* verde */
    --danger: #ef4444;          /* rosso */
    --warning: #f59e0b;         /* ambra */

    /* Raggi e ombre */
    --r-lg: 18px; --r-md: 14px; --r-sm: 10px;
    --shadow-1: 0 10px 30px rgba(17, 24, 39, .06);
    --shadow-2: 0 16px 50px rgba(17, 24, 39, .08);

    /* Gradiente brand */
    --grad: radial-gradient(900px 500px at 105% 0%, rgba(79,70,229,.10), transparent 60%),
            radial-gradient(700px 400px at -5% 20%, rgba(6,182,212,.12), transparent 60%);
  }

  *{box-sizing:border-box}
  html, body{height:100%}
  body{
    margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color:var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing:grayscale;
    background-image: var(--grad);
    background-attachment: fixed; /* verrà disattivato in mobile */
  }

  a{color:var(--primary); text-decoration: none}
  a:hover{ text-decoration: underline }

  /* ===== Topbar (se non usi l'header custom, puoi rimuovere questi stili) ===== */
  .topbar{
    position: sticky; top:0; z-index: 50;
    backdrop-filter: saturate(130%) blur(10px);
    background: rgba(255,255,255,.75);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner{ max-width:1200px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; gap:14px; }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.05rem; letter-spacing:.2px; }
  .brand-badge{ width:28px; height:28px; border-radius:8px; background: linear-gradient(135deg, var(--primary), var(--accent)); box-shadow: var(--shadow-1); }
  .crumbs{ margin-left:auto; font-size:.9rem; color:var(--muted); }

  /* ===== Container principale ===== */
  .shell{ max-width:1200px; margin:30px auto; padding: 0 18px; }

  .layout{
    display:grid; grid-template-columns: 360px 1fr; gap: 24px;
  }
  @media (max-width: 980px){ .layout{ grid-template-columns: 1fr; } }

  /* ===== Aside sticky (poster + info chiave) ===== */
  .aside{
    position: sticky; top: 84px; align-self: start;
    display: grid; gap:16px;
  }

  .poster{
    position: relative; z-index: 1;            /* evita che sembri “dietro” in mobile */
    border-radius: var(--r-lg); overflow:hidden; background: var(--panel);
    border:1px solid var(--border); box-shadow: var(--shadow-2);
  }
  .poster img{ width:100%; display:block; aspect-ratio: 3/4; object-fit: cover; }

  .pill{ display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:.8rem; padding:8px 12px;
    border-radius:999px; border:1px solid var(--border); background: var(--soft); color:#334155; }
  .pills{ display:flex; gap:8px; flex-wrap:wrap; }

  .stat-card{
    background: var(--panel); border:1px solid var(--border); border-radius: var(--r-lg);
    padding: 14px; box-shadow: var(--shadow-1);
  }
  .stat-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size:.95rem; }
  .stat-row p{ margin:0; color:var(--muted); }
  .stat-row strong{ color:var(--ink); }

  /* ===== Main content ===== */
  .main{
    display:grid; gap: 18px;
  }

  .hero{
    background: var(--panel); border:1px solid var(--border); border-radius: var(--r-lg);
    box-shadow: var(--shadow-2); padding: 18px; position: relative; overflow: clip;
  }
  .hero::after{
    content:""; position:absolute; inset:auto -20% -50% -20%; height: 180px; background:
    radial-gradient(60% 70% at 50% 0%, rgba(79,70,229,.08), transparent 60%);
  }
  .hero h1{ margin:6px 0 10px; font-size: clamp(1.6rem, 2.1vw + 1rem, 2.3rem); letter-spacing:.2px; }
  .sub{ color: var(--muted); font-size: .95rem; }

  .chips{ display:flex; flex-wrap: wrap; gap:8px; margin-top: 10px; }
  .chip{ background: #eef2ff; color:#3730a3; border:1px solid #e0e7ff; padding:6px 10px; border-radius: 999px; font-size:.8rem; }

  .panel{
    background: var(--panel); border:1px solid var(--border); border-radius: var(--r-lg);
    box-shadow: var(--shadow-1); padding: 16px;
  }
  .panel h2{ margin:0 0 10px; font-size:1.05rem; letter-spacing:.2px; }

  .grid-kv{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 16px;
  }
  .grid-kv p{ margin:0; }
  .grid-kv strong{ color: var(--ink); }
  .desc{ line-height:1.8; color:#1f2937; }

  iframe{ width:100%; height: 400px; border:0; border-radius: var(--r-md); background: var(--soft); border:1px solid var(--border); }

  .nav-prevnext{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .link-btn{ display:inline-flex; align-items:center; gap:8px; padding:10px 12px; border-radius: 12px; border:1px solid var(--border); background: var(--panel); box-shadow: var(--shadow-1); }
  .link-btn:hover{ transform: translateY(-1px); transition: transform .15s ease; text-decoration:none }

  /* ===== Loading & Error ===== */
  .center{ text-align:center; padding: 48px 0; color: var(--muted); }
  .error{ color: var(--danger); }

  /* ===== Entrance motion ===== */
  @keyframes pop{ from{opacity:0; transform: translateY(6px)} to{opacity:1; transform:none} }
  .hero, .panel, .poster, .stat-card{ animation: pop .35s ease both }

  /* ======= FIX RESPONSIVE: abilita lo scroll e rimuovi effetti che “bloccano” ======= */
  /* 1) In mobile disattiva sticky: tutto scorre normalmente */
  @media (max-width: 980px) {
    .aside { position: static; top: auto; }
    .hero { overflow: visible; } /* evita clipping che può sembrare “dietro” */
  }

  /* 2) Evita glitch di background fisso su iOS/Android */
  @media (max-width: 980px), (hover: none) and (pointer: coarse) {
    body { background-attachment: scroll; }
  }

  /* Preloader (come index) */
#preloader{
  position: fixed; inset: 0; background: #ffffff;
  display: grid; place-items: center;
  transition: opacity .4s ease; z-index: 9999;
}
.spinner{
  width: 44px; height: 44px; border-radius: 50%;
  border: 4px solid #e3e3e3; border-top-color: #007BFF;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

</style>
</head>
<body>

<!-- 🔄 Preloader -->
<div id="preloader" aria-hidden="true">
  <div class="spinner" role="status" aria-label="Loading"></div>
</div>
  
  <div id="header"></div>

  <div class="shell">
    <main id="content" role="main" aria-live="polite">
      <div class="center" id="loading">Loading…</div>
    </main>
  </div>

  <div id="footer"></div>

  <script>
    // ===== Utils =====
    const esc = (s='') => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
    const safe = (v) => (v===null||v===undefined||v==='') ? '—' : String(v);
    const parseCSV = (t) => Papa.parse(t, { header:true, skipEmptyLines:true }).data || [];
    const parseArray = (str) => {
      if (!str) return [];
      try { const arr = JSON.parse(str); return Array.isArray(arr) ? arr : [String(str)]; }
      catch { return String(str).replace(/^\[|\]$/g,'').split(',').map(s=>s.replace(/^[\'"\s]+|[\'"\s]+$/g,'').trim()).filter(Boolean); }
    };
    const toYouTubeEmbed = (url) => {
      if (!url) return null;
      try {
        let id = null;
        const u = new URL(url);
        if (u.hostname.includes('youtu.be')) id = u.pathname.slice(1);
        else if (u.searchParams.get('v')) id = u.searchParams.get('v');
        else {
          const m = url.match(/\/embed\/([a-zA-Z0-9_-]{11})/);
          if (m) id = m[1];
        }
        if (!id) return null;
    
        const params = new URLSearchParams({
          rel: '0',
          modestbranding: '1',
          iv_load_policy: '3',
          playsinline: '1',
          origin: location.origin
        });
    
        return `https://www.youtube-nocookie.com/embed/${id}?${params.toString()}`;
      } catch {
        return null;
      }
    };
    const getSlugFromPath = () => {
      const parts = location.pathname.split("/").filter(Boolean);
      const i = parts.indexOf("anime"); return (i!==-1 && parts[i+1]) ? parts[i+1] : "";
    };
    const getMalSlug = (malUrl) => {
      try { const u = new URL(malUrl); const p = u.pathname.split('/').filter(Boolean); return p[p.length-1]||""; } catch { return ""; }
    };
    const buildPrettyUrl = (anime) =>
  `${location.origin}/anime.html?slug=${getMalSlug(anime.url)}`;
    const schemaTypeFromType = (t) => {
      const v = String(t||'').toLowerCase();
      if (v.includes('movie')) return 'Movie';
      if (v.includes('tv')) return 'TVSeries';
      if (v.includes('ova') || v.includes('ona')) return 'CreativeWorkSeries';
      return 'CreativeWork';
    };

    // Header/Footer
    fetch("/header.html").then(r=>r.text()).then(t=>{ document.getElementById("header").innerHTML = t; }).catch(()=>{});
    fetch("/footer.html").then(r=>r.text()).then(t=>{ document.getElementById("footer").innerHTML = t; }).catch(()=>{});

    // ===== Preloader lifecycle (uguale all'index) =====
let assetsLoaded = false;
let dataRendered = false;

function hidePreloader() {
  const pre = document.getElementById("preloader");
  if (!pre) return;
  pre.style.opacity = "0";
  pre.style.pointerEvents = "none";
  setTimeout(() => pre && pre.parentNode && pre.parentNode.removeChild(pre), 400);
}
function tryHidePreloader() {
  if (assetsLoaded && dataRendered) hidePreloader();
}

// Quando tutte le risorse (font, immagini, ecc.) sono caricate
window.addEventListener("load", () => { assetsLoaded = true; tryHidePreloader(); });

// Safety net (se qualcosa resta appeso, chiudi comunque)
setTimeout(() => hidePreloader(), 8000);

    // Labels/Sections
    const columnLabels = {
      anime_id:"Anime ID", title:"Title", type:"Type", score:"Score", scored_by:"Ratings Count",
      status:"Status", episodes:"Episodes", start_date:"Start Date", end_date:"End Date",
      source:"Source", members:"Members", favorites:"Favorites",
      episode_duration:"Episode Duration", total_duration:"Total Duration", rating:"Content Rating", sfw:"SFW",
      approved:"Approved", created_at:"Created At", updated_at:"Updated At", start_year:"Start Year",
      start_season:"Start Season", real_start_date:"Real Start Date", real_end_date:"Real End Date",
      broadcast_day:"Broadcast Day", broadcast_time:"Broadcast Time", genres:"Genres", themes:"Themes", demographics:"Demographics",
      studios:"Studios", producers:"Producers", licensors:"Licensors", synopsis:"Synopsis", background:"Background",
      main_picture:"Main Image", url:"Source URL", trailer_url:"Trailer URL", title_english:"English Title",
      title_japanese:"Japanese Title", title_synonyms:"Alternative Titles"
    };

    const sections = {
      "Identity & Titles": ["title","title_english","title_japanese","title_synonyms"],
      "Classification & Ratings": ["type","score","scored_by","status","rating","sfw"],
      "Episodes & Duration": ["episodes","episode_duration","total_duration"],
      "Dates & Broadcast": ["start_date","end_date","real_start_date","real_end_date","start_year","start_season","broadcast_day","broadcast_time"],
      "Origin & Production": ["source","studios","producers","licensors"],
      "Popularity & Insight": ["members","favorites","approved","genres","themes","demographics"],
      "Technical": ["created_at","updated_at"]
    };

    function formatMultiline(text) {
      if (!text) return "—";
      const stripped = String(text).replace(/\[Written by MAL Rewrite\]$/,'');
      return esc(stripped).replace(/\r\n|\r|\n/g, "<br>");
    }

function renderDetails(anime) {
  const genresArr = parseArray(anime.genres);
  const studiosArr = parseArray(anime.studios);
  const genresList = genresArr.join(", ") || "—";
  const studiosList = studiosArr.join(", ") || "—";
  const imgSrc = (anime.main_picture && anime.main_picture.trim())
    ? anime.main_picture
    : "https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg";

  // Helper: normalizza qualsiasi valore potenzialmente "lista in stringa"
  const prettyValue = (val) => {
    if (val === null || val === undefined || val === "") return "—";
    // Se è una stringa tipo "['A','B']" prova a parsare
    if (typeof val === "string" && val.trim().startsWith("[") && val.trim().endsWith("]")) {
      const arr = parseArray(val);
      if (Array.isArray(arr) && arr.length) return arr.join(", ");
      // fallback pulizia semplice
      return val.replace(/^\[|\]$/g, "").replace(/['"]/g, "").trim() || "—";
    }
    return String(val);
  };

  let html = `
    <div class="layout">
      <aside class="aside" aria-label="Poster and primary facts">
        <figure class="poster">
          <img src="${esc(imgSrc)}" alt="${esc(anime.title || anime.title_english || 'Anime cover')}"
               onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg'" />
        </figure>
        <div class="pills">
          <span class="pill">${esc(safe(anime.type))}</span>
          ${anime.rating ? `<span class="pill">${esc(safe(anime.rating))}</span>` : ''}
        </div>
        <div class="stat-card" aria-label="Quick stats">
          <div class="stat-row">
            <p>Score</p><strong>${esc(safe(anime.score))}</strong>
            <p>Ratings</p><strong>${esc(safe(anime.scored_by))}</strong>
            <p>Episodes</p><strong>${esc(safe(anime.episodes))}</strong>
            <p>Status</p><strong>${esc(safe(anime.status))}</strong>
          </div>
        </div>
      </aside>

      <section class="main">
        <header class="hero">
          <h1>${esc(anime.title_english || anime.title || 'Anime')}</h1>
          <div class="sub">🗓 ${esc(safe(anime.start_date))} — ${anime.end_date ? esc(safe(anime.end_date)) : "Ongoing"}</div>
          <div class="sub">📺 Studio: ${esc(studiosList)}</div>
          <div class="chips" role="list">${genresArr.map(g=>`<span class='chip' role='listitem'>${esc(g)}</span>`).join('')}</div>
        </header>

        ${toYouTubeEmbed(anime.trailer_url) ? `
        <section class="panel" aria-label="Trailer">
          <h2>Trailer</h2>
          <iframe
            src="${esc(toYouTubeEmbed(anime.trailer_url))}"
            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
            title="Trailer"></iframe>
        </section>`: ''}

        <section class="panel" aria-label="Synopsis">
          <h2>Synopsis</h2>
          <p class="desc">${formatMultiline(anime.synopsis)}</p>
        </section>

        ${Object.entries(sections).map(([name, fields])=>{
          const parts = [];
          for (const f of fields) {
            let v = anime[f];

            // salta valori vuoti/lista vuota
            if (v === null || v === undefined || v === '' || (typeof v === 'string' && v.trim() === '[]')) continue;

            // formatta liste come "A, B, C"
            if (typeof v === 'string' && v.trim().startsWith('[') && v.trim().endsWith(']')) {
              const arr = parseArray(v);
              v = (Array.isArray(arr) && arr.length) ? arr.join(', ') : v.replace(/^\[|\]$/g,'').replace(/['"]/g,'').trim();
            }

            parts.push(`<p><strong>${esc(columnLabels[f]||f)}:</strong> ${esc(safe(prettyValue(v)))}</p>`);
          }
          return parts.length ? `<section class="panel" aria-label="${esc(name)}"><h2>${esc(name)}</h2><div class="grid-kv">${parts.join('')}</div></section>` : '';
        }).join('')}

        <nav class="nav-prevnext" aria-label="Previous/Next"></nav>
      </section>
    </div>`;

  return html;
}

    function setDynamicMeta(anime) {
      const title = (anime.title_english || anime.title || "Anime").trim();
      const desc = (anime.synopsis || "").replace(/\s+/g,' ').slice(0, 160);
      const url = `${location.origin}/anime.html?slug=${getMalSlug(anime.url)}`;
      const img = (anime.main_picture && anime.main_picture.trim())
        ? anime.main_picture
        : "https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg";

      // Title & Description
      document.title = `${title} — AniMMUnity`;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', desc);

      // Canonical
      const can = document.getElementById('canonicalLink');
      if (can) can.href = url;

      // OG/Twitter
      const set = (sel, val) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
      set('meta[property="og:title"]', title);
      set('meta[property="og:description"]', desc);
      set('meta[property="og:url"]', url);
      set('meta[property="og:image"]', img);
      set('meta[name="twitter:title"]', title);
      set('meta[name="twitter:description"]', desc);
      set('meta[name="twitter:image"]', img);

      // Breadcrumbs
      const bc = {
        "@context":"https://schema.org",
        "@type":"BreadcrumbList",
        "itemListElement":[
          {"@type":"ListItem","position":1,"name":"Home","item":`${location.origin}/`},
          {"@type":"ListItem","position":2,"name":"Anime List","item":`${location.origin}/`},
          {"@type":"ListItem","position":3,"name":title,"item":url}
        ]
      };
      document.getElementById('ld-breadcrumbs').textContent = JSON.stringify(bc);

      // Entity (TVSeries/Movie/CreativeWork)
      const schemaType = schemaTypeFromType(anime.type);
       const entity = {
         "@context":"https://schema.org",
         "@type": schemaType,
         "name": title,
         "url": url,
         "image": img,
         "genre": parseArray(anime.genres),
         "inLanguage": "ja",
         "numberOfEpisodes": Number(anime.episodes) || undefined,
         "datePublished": anime.start_date || undefined,
         "dateEnded": anime.end_date || undefined,
         "dateModified": anime.updated_at || undefined,
         "sameAs": anime.url || undefined,
         "productionCompany": parseArray(anime.studios).length ? {
           "@type":"Organization",
           "name": parseArray(anime.studios).join(", ")
         } : undefined,
         "aggregateRating": (anime.score && anime.scored_by) ? {
           "@type":"AggregateRating",
           "ratingValue": String(anime.score),
           "ratingCount": Number(anime.scored_by)
         } : undefined,
         "description": desc
       };
      const embedUrl = toYouTubeEmbed(anime.trailer_url);
      if (embedUrl) {
        entity.trailer = {
          "@type":"VideoObject",
          "name": `${title} — Trailer`,
          "embedUrl": embedUrl,
          "thumbnailUrl": img
        };
      }
      document.getElementById('ld-entity').textContent = JSON.stringify(entity);
    }

    // Prev/Next (alphabetical)
    function renderPrevNext(navRoot, data, current) {
      const byTitle = [...data].sort((a,b) => (a.title||'').localeCompare(b.title||''));
      const idx = byTitle.findIndex(a => a.anime_id === current.anime_id);
      const prev = idx > 0 ? byTitle[idx-1] : null;
      const next = idx < byTitle.length-1 ? byTitle[idx+1] : null;
      if (!prev && !next) return;
    
      const slugPrev = prev ? getMalSlug(prev.url) : null;
      const slugNext = next ? getMalSlug(next.url) : null;
    
      navRoot.innerHTML = `
        <div>${prev ? `<a class="link-btn" href="/anime.html?slug=${esc(slugPrev)}">⬅️ ${esc(prev.title || prev.title_english || 'Previous')}</a>` : ''}</div>
        <div>${next ? `<a class="link-btn" href="/anime.html?slug=${esc(slugNext)}">${esc(next.title || next.title_english || 'Next')} ➡️</a>` : ''}</div>
      `;
    }

    // Boot
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(location.search);
      const animeId = (params.get("id")||"").trim();
      const slugFromQuery = (params.get("slug")||"").trim();
      const slugFromPath = getSlugFromPath();

fetch("/data/anime.csv")
  .then(r => { 
    if (!r.ok) throw new Error(`HTTP ${r.status}`); 
    return r.text(); 
  })
  .then(csv => {
    const data = parseCSV(csv).map(r => ({ ...r, anime_id: String(r.anime_id || '').trim() }));

    let anime = null;
    if (animeId) {
      anime = data.find(a => a.anime_id === animeId);
    } else {
      const slug = slugFromQuery || slugFromPath;
      if (slug) anime = data.find(a => getMalSlug(a.url) === slug);
    }

    const contentEl = document.getElementById("content");
    if (!anime) {
      const msg = animeId ? `ID: ${esc(animeId)}` : `Slug: ${esc(slugFromQuery || slugFromPath || '—')}`;
      contentEl.innerHTML = `<div class="center error">Anime not found<br>${msg}</div>`;
      dataRendered = true; // ✅ segnala fine caricamento dati
      tryHidePreloader();
      return;
    }

// Canonical coerente con la sitemap (URL con query)
const slug = getMalSlug(anime.url);
const canonical = `${location.origin}/anime.html?slug=${slug}`;

// Non forzare più l'URL "pretty" in barra
// Se l'utente è arrivato da /anime/<slug>, opzionale normalizzare alla query:
if (location.pathname.startsWith("/anime/") && !location.search.includes("slug=")) {
  history.replaceState(null, "", `/anime.html?slug=${encodeURIComponent(slug)}`);
}

    // Render + SEO
    contentEl.innerHTML = renderDetails(anime);
    setDynamicMeta(anime);
    const navRoot = contentEl.querySelector('.nav-prevnext');
    if (navRoot) renderPrevNext(navRoot, data, anime);

    dataRendered = true; // ✅ segnala fine caricamento dati
    tryHidePreloader();
  })
  .catch(err => {
    document.getElementById("content").innerHTML = `<div class="center error">Load error: ${esc(err?.message || err)}</div>`;
    dataRendered = true; // ✅ segnala fine caricamento anche in errore
    tryHidePreloader();
  })
  .finally(() => {
    const loading = document.getElementById("loading");
    if (loading) loading.remove();
  });
});
  </script>
</body>
</html>
