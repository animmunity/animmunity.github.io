<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Anime Detail — AniMMUnity</title>
  <meta name="description" content="Anime detail page with trailer, information, studios, genres and full metadata on AniMMUnity.">

  <!-- Robots -->
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

  <!-- Theme color -->
  <meta name="theme-color" content="#ffffff">

  <!-- Open Graph / Twitter (filled via JS) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AniMMUnity">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="">
  <link id="canonicalLink" rel="canonical" href="">

  <!-- JSON-LD placeholders -->
  <script id="ld-breadcrumbs" type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[]}</script>
  <script id="ld-entity" type="application/ld+json">{"@context":"https://schema.org","@type":"CreativeWork"}</script>

  <!-- Assets -->
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>

  <style>
    /* =====================
       Modern Aura Theme
       (solo CSS: funzioni JS invariate)
       ===================== */
    :root{
      --bg: #0b0d12;           /* sfondo profondo */
      --surface: #10131a;      /* pannelli */
      --card: #11161d;         /* card principale */
      --elev: #0e1117;         /* superfici sopraelevate */
      --text: #e8ecf2;         /* testo principale */
      --muted: #a9b1bd;        /* testo attenuato */
      --border: #1f2530;       /* bordi sottili */
      --brand: #75ffbe;        /* brand mint */
      --brand-ink: #0a9f7c;    /* brand scuro */
      --accent: #68b6ff;       /* accento blu */
      --danger: #ff6482;       /* errori */
      --shadow: 0 10px 40px rgba(0,0,0,.35);
      --shadow-soft: 0 8px 24px rgba(0,0,0,.25);
      --radius: 18px;
      --radius-sm: 12px;
      --grad: linear-gradient(135deg, rgba(117,255,190,.22), rgba(104,182,255,.18) 55%, rgba(255,100,130,.18));
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      font-family: 'Nunito Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1000px 600px at 10% -10%, rgba(104,182,255,.12), transparent 60%),
        radial-gradient(800px 500px at 100% 10%, rgba(117,255,190,.10), transparent 60%),
        var(--bg);
      color: var(--text);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header / Footer slots */
    #header, #footer { backdrop-filter: saturate(120%) blur(10px); }

    /* Container */
    .anime-container{
      max-width: 1200px;
      margin: 48px auto;
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00)), var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }
    .anime-container::before{
      content: "";
      position:absolute; inset: -1px; z-index:0; pointer-events:none;
      background: var(--grad);
      filter: blur(30px) saturate(120%);
      opacity: .35;
      mask: radial-gradient(600px 280px at 20% 0%, #000 20%, transparent 60%)
            radial-gradient(400px 220px at 95% 5%, #000 15%, transparent 60%);
    }
    .anime-container > * { position: relative; z-index: 1; }

    /* Header area */
    .anime-header{
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 28px;
      align-items: start;
      padding-bottom: 22px;
      border-bottom: 1px dashed var(--border);
    }
    @media (max-width: 900px){ .anime-header{ grid-template-columns: 1fr; } }

    .anime-image{
      width: 100%; max-width: 100%; aspect-ratio: 3/4; object-fit: cover;
      border-radius: var(--radius-sm);
      background: radial-gradient(80% 60% at 50% 35%, rgba(117,255,190,.10), rgba(104,182,255,.08)) #0c1118;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
    }

    .anime-details{ min-width: 280px; }
    .anime-details h1{
      margin: 8px 0 10px;
      font-size: clamp(1.6rem, 2.1vw + 1rem, 2.35rem);
      line-height: 1.15;
      letter-spacing: 0.2px;
      text-shadow: 0 1px 0 rgba(0,0,0,.25);
    }

    .badge{ display:inline-flex; align-items:center; gap:8px;
      padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size:.85rem;
      background: rgba(117,255,190,.14); color: #c8ffee; border: 1px solid rgba(117,255,190,.35);
      margin:0 10px 8px 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }
    .badge[data-variant="rating"]{ background: rgba(104,182,255,.12); border-color: rgba(104,182,255,.35); color:#cfe7ff; }

    .anime-meta{ margin: 6px 0; font-size: 0.98rem; color: var(--muted); }

    h2{ font-size: 1.15rem; margin: 26px 0 12px; color: var(--text); letter-spacing: .3px;
        position: relative; display: inline-flex; align-items: center; gap: 10px; }
    h2::before{ content:""; width: 10px; height: 10px; border-radius: 3px;
        background: conic-gradient(from 0deg, var(--brand), var(--accent), var(--danger), var(--brand));
        box-shadow: 0 0 0 3px rgba(117,255,190,.12), 0 0 0 7px rgba(104,182,255,.06);
    }

    .anime-section, .anime-description{ margin-top: 12px; line-height: 1.75; color: #dfe6ef; }

    .kv{ display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
         gap: 12px 18px; padding: 14px; border: 1px dashed var(--border); border-radius: var(--radius-sm);
         background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00)); }
    .kv p{ margin:0; font-size:.97rem; }
    .kv strong{ color:#f2f5f9; font-weight:800; }

    iframe{ width:100%; height: 380px; border: none; border-radius: var(--radius-sm);
            box-shadow: var(--shadow-soft); background:#0a0f15; border:1px solid var(--border); }

    .nav-prevnext{ display:flex; justify-content:space-between; gap:12px; margin-top:30px; flex-wrap:wrap; }
    .nav-prevnext a{ display:inline-flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--border);
        border-radius: 12px; text-decoration:none; font-size:.95rem; color:#eaf2ff; background: #0c121a;
        transition: transform .15s ease, background .2s ease, border-color .2s ease; }
    .nav-prevnext a:hover{ background: #0f1621; transform: translateY(-1px); border-color: rgba(117,255,190,.35); }

    .error{ text-align:center; margin: 100px 0; font-size: 1.05rem; color: var(--danger); }
    #loading{ text-align:center; padding: 40px 0; color: var(--muted); font-size: 1rem; }

    /* Chips for lists (genres, studios) inside header meta */
    .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .chip{ padding:6px 10px; border-radius: 999px; border:1px solid var(--border); background:#0b1118; color:#c9d7e6; font-size:.85rem; }

    /* Link reset for cover click (if ever added) */
    a{ color: #cfe7ff; }
  </style>
</head>
<body>
  <div id="header"></div>

  <main id="content" class="anime-container" role="main" aria-live="polite">
    <div id="loading">Loading…</div>
  </main>

  <div id="footer"></div>

  <script>
    // ===== Utils =====
    const esc = (s='') => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
    const safe = (v) => (v===null||v===undefined||v==='') ? '—' : String(v);
    const parseCSV = (t) => Papa.parse(t, { header:true, skipEmptyLines:true }).data || [];
    const parseArray = (str) => {
      if (!str) return [];
      try { const arr = JSON.parse(str); return Array.isArray(arr) ? arr : [String(str)]; }
      catch { return String(str).replace(/^\[|\]$/g,'').split(',').map(s=>s.replace(/^[\'"\s]+|[\'"\s]+$/g,'').trim()).filter(Boolean); }
    };
    const toYouTubeEmbed = (url) => {
      if (!url) return null;
      try {
        if (url.includes("/watch?v=")) return url.replace("watch?v=", "embed/");
        if (url.includes("youtu.be/")) return url.replace("youtu.be/", "www.youtube.com/embed/");
        if (url.includes("/embed/")) return url;
      } catch {}
      return null;
    };
    const getSlugFromPath = () => {
      const parts = location.pathname.split("/").filter(Boolean);
      const i = parts.indexOf("anime"); return (i!==-1 && parts[i+1]) ? parts[i+1] : "";
    };
    const getMalSlug = (malUrl) => {
      try { const u = new URL(malUrl); const p = u.pathname.split('/').filter(Boolean); return p[p.length-1]||""; } catch { return ""; }
    };
    const buildPrettyUrl = (anime) => `${location.origin}/anime/${getMalSlug(anime.url)}`;
    const schemaTypeFromType = (t) => {
      const v = String(t||'').toLowerCase();
      if (v.includes('movie')) return 'Movie';
      if (v.includes('tv')) return 'TVSeries';
      if (v.includes('ova') || v.includes('ona')) return 'CreativeWorkSeries';
      return 'CreativeWork';
    };

    // Header/Footer
    fetch("header.html").then(r=>r.text()).then(t=>{ document.getElementById("header").innerHTML = t; }).catch(()=>{});
    fetch("footer.html").then(r=>r.text()).then(t=>{ document.getElementById("footer").innerHTML = t; }).catch(()=>{});

    // Labels/Sections
    const columnLabels = {
      anime_id:"Anime ID", title:"Title", type:"Type", score:"Score", scored_by:"Ratings Count",
      status:"Status", episodes:"Episodes", start_date:"Start Date", end_date:"End Date",
      source:"Source", members:"Members", favorites:"Favorites",
      episode_duration:"Episode Duration", total_duration:"Total Duration", rating:"Content Rating", sfw:"SFW",
      approved:"Approved", created_at:"Created At", updated_at:"Updated At", start_year:"Start Year",
      start_season:"Start Season", real_start_date:"Real Start Date", real_end_date:"Real End Date",
      broadcast_day:"Broadcast Day", broadcast_time:"Broadcast Time", genres:"Genres", themes:"Themes", demographics:"Demographics",
      studios:"Studios", producers:"Producers", licensors:"Licensors", synopsis:"Synopsis", background:"Background",
      main_picture:"Main Image", url:"Source URL", trailer_url:"Trailer URL", title_english:"English Title",
      title_japanese:"Japanese Title", title_synonyms:"Alternative Titles"
    };

    const sections = {
      "Identity & Titles": ["title","title_english","title_japanese","title_synonyms"],
      "Classification & Ratings": ["type","score","scored_by","status","rating","sfw"],
      "Episodes & Duration": ["episodes","episode_duration","total_duration"],
      "Dates & Broadcast": ["start_date","end_date","real_start_date","real_end_date","start_year","start_season","broadcast_day","broadcast_time"],
      "Origin & Production": ["source","studios","producers","licensors"],
      "Popularity & Insight": ["members","favorites","approved","genres","themes","demographics"],
      "Technical": ["created_at","updated_at"]
    };

    function formatMultiline(text) {
      if (!text) return "—";
      const stripped = String(text).replace(/\[Written by MAL Rewrite\]$/,'');
      return esc(stripped).replace(/\r\n|\r|\n/g, "<br>");
    }

    function renderDetails(anime) {
      const genresArr = parseArray(anime.genres);
      const studiosArr = parseArray(anime.studios);
      const genresList = genresArr.join(", ") || "—";
      const studiosList = studiosArr.join(", ") || "—";
      const imgSrc = (anime.main_picture && anime.main_picture.trim())
        ? anime.main_picture
        : "https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg";

      let html = `
        <div class="anime-header">
          <img class="anime-image" src="${esc(imgSrc)}" alt="${esc(anime.title || anime.title_english || 'Anime cover')}"
               onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg'"/>
          <div class="anime-details">
            <div>
              <span class="badge">${esc(safe(anime.type))}</span>
              ${anime.rating ? `<span class="badge" data-variant="rating">${esc(safe(anime.rating))}</span>` : ''}
            </div>
            <h1>${esc(anime.title_english || anime.title || 'Anime')}</h1>
            <div class="anime-meta">🗓 ${esc(safe(anime.start_date))} — ${anime.end_date ? esc(safe(anime.end_date)) : "Ongoing"}</div>
            <div class="anime-meta">🎥 Episodes: ${esc(safe(anime.episodes))} · ⭐ Score: ${esc(safe(anime.score))} (${esc(safe(anime.scored_by))} ratings)</div>
            <div class="anime-meta">📺 Studio: ${esc(studiosList)}</div>
            <div class="anime-meta">🎭 Genres: ${esc(genresList)}</div>
            ${genresArr.length ? `<div class="chips">${genresArr.map(g=>`<span class='chip'>${esc(g)}</span>`).join('')}</div>`:''}
          </div>
        </div>`;

      const embedUrl = toYouTubeEmbed(anime.trailer_url);
      if (embedUrl) {
        html += `
          <div class="anime-section">
            <h2>Trailer</h2>
            <iframe src="${esc(embedUrl)}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="Trailer"></iframe>
          </div>`;
      }

      html += `
        <div class="anime-description">
          <h2>Synopsis</h2>
          <p>${formatMultiline(anime.synopsis)}</p>
        </div>`;

      // Key-value sections
      for (const [sectionName, fields] of Object.entries(sections)) {
        const parts = [];
        for (const f of fields) {
          let v = anime[f];
          if (v===null || v===undefined || v==='' || (typeof v==='string' && v.trim()==='[]')) continue;
          if (typeof v === 'string' && v.startsWith('[') && v.endsWith(']')) {
            try { v = JSON.parse(v).join(', '); } catch {}
          }
          parts.push(`<p><strong>${esc(columnLabels[f]||f)}:</strong> ${esc(safe(v))}</p>`);
        }
        if (parts.length) {
          html += `<div class="anime-section"><h2>${esc(sectionName)}</h2><div class="kv">${parts.join('')}</div></div>`;
        }
      }

      return html;
    }

    function setDynamicMeta(anime) {
      const title = (anime.title_english || anime.title || "Anime").trim();
      const desc = (anime.synopsis || "").replace(/\s+/g,' ').slice(0, 160);
      const url = buildPrettyUrl(anime);
      const img = (anime.main_picture && anime.main_picture.trim())
        ? anime.main_picture
        : "https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg";

      // Title & Description
      document.title = `${title} — AniMMUnity`;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', desc);

      // Canonical
      const can = document.getElementById('canonicalLink');
      if (can) can.href = url;

      // OG/Twitter
      const set = (sel, val) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
      set('meta[property="og:title"]', title);
      set('meta[property="og:description"]', desc);
      set('meta[property="og:url"]', url);
      set('meta[property="og:image"]', img);
      set('meta[name="twitter:title"]', title);
      set('meta[name="twitter:description"]', desc);
      set('meta[name="twitter:image"]', img);

      // Breadcrumbs
      const bc = {
        "@context":"https://schema.org",
        "@type":"BreadcrumbList",
        "itemListElement":[
          {"@type":"ListItem","position":1,"name":"Home","item":`${location.origin}/`},
          {"@type":"ListItem","position":2,"name":"Anime List","item":`${location.origin}/`},
          {"@type":"ListItem","position":3,"name":title,"item":url}
        ]
      };
      document.getElementById('ld-breadcrumbs').textContent = JSON.stringify(bc);

      // Entity (TVSeries/Movie/CreativeWork)
      const schemaType = schemaTypeFromType(anime.type);
      const entity = {
        "@context":"https://schema.org",
        "@type": schemaType,
        "name": title,
        "url": url,
        "image": img,
        "genre": parseArray(anime.genres),
        "inLanguage": "ja",
        "numberOfEpisodes": Number(anime.episodes) || undefined,
        "datePublished": anime.start_date || undefined,
        "dateEnded": anime.end_date || undefined,
        "productionCompany": parseArray(anime.studios).length ? {
          "@type":"Organization",
          "name": parseArray(anime.studios).join(", ")
        } : undefined,
        "aggregateRating": (anime.score && anime.scored_by) ? {
          "@type":"AggregateRating",
          "ratingValue": String(anime.score),
          "ratingCount": Number(anime.scored_by)
        } : undefined,
        "description": desc
      };
      const embedUrl = toYouTubeEmbed(anime.trailer_url);
      if (embedUrl) {
        entity.trailer = {
          "@type":"VideoObject",
          "name": `${title} — Trailer`,
          "embedUrl": embedUrl,
          "thumbnailUrl": img
        };
      }
      document.getElementById('ld-entity').textContent = JSON.stringify(entity);
    }

    // Prev/Next (alphabetical)
    function renderPrevNext(navRoot, data, current) {
      const byTitle = [...data].sort((a,b) => (a.title||'').localeCompare(b.title||''));
      const idx = byTitle.findIndex(a => a.anime_id === current.anime_id);
      const prev = idx > 0 ? byTitle[idx-1] : null;
      const next = idx < byTitle.length-1 ? byTitle[idx+1] : null;
      if (!prev && !next) return;

      const wrap = document.createElement('div');
      wrap.className = 'nav-prevnext';
      wrap.innerHTML = `
        <div>${prev ? `<a href="/anime/${esc(getMalSlug(prev.url))}">← ${esc(prev.title || prev.title_english || 'Previous')}</a>` : ''}</div>
        <div>${next ? `<a href="/anime/${esc(getMalSlug(next.url))}">${esc(next.title || next.title_english || 'Next')} →</a>` : ''}</div>
      `;
      navRoot.appendChild(wrap);
    }

    // Boot
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(location.search);
      const animeId = (params.get("id")||"").trim();
      const slugFromQuery = (params.get("slug")||"").trim();
      const slugFromPath = getSlugFromPath();

      fetch("data/anime.csv")
        .then(r => { if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
        .then(csv => {
          const data = parseCSV(csv).map(r => ({ ...r, anime_id: String(r.anime_id||'').trim() }));

          let anime = null;
          if (animeId) {
            anime = data.find(a => a.anime_id === animeId);
          } else {
            const slug = slugFromQuery || slugFromPath;
            if (slug) anime = data.find(a => getMalSlug(a.url) === slug);
          }

          const contentEl = document.getElementById("content");
          if (!anime) {
            const msg = animeId ? `ID: ${esc(animeId)}` : `Slug: ${esc(slugFromQuery || slugFromPath || '—')}`;
            contentEl.innerHTML = `<div class="error">Anime not found<br>${msg}</div>`;
            return;
          }

          // Pretty URL + Canonical
          const pretty = "/anime/" + getMalSlug(anime.url);
          if (!animeId && (slugFromQuery || slugFromPath) && (location.pathname !== pretty)) {
            history.replaceState(null, "", pretty);
          }
          const c = document.getElementById("canonicalLink");
          if (c) c.href = location.origin + pretty;

          // Render + SEO
          contentEl.innerHTML = renderDetails(anime);
          setDynamicMeta(anime);
          renderPrevNext(contentEl, data, anime);
        })
        .catch(err => {
          document.getElementById("content").innerHTML = `<div class="error">Load error: ${esc(err?.message || err)}</div>`;
        })
        .finally(() => {
          const loading = document.getElementById("loading"); if (loading) loading.remove();
        });
    });
  </script>
</body>
</html>
