    /* =====================================================
       HYPERLIGHT — Futuristic Light UI
       ===================================================== */
    :root{
      --bg:#fcfcff; --ink:#0b1220; --muted:#667085; --panel:#ffffff; --border:#e7e9f1;
      --ring:#dbeafe; --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#eef2ff;
      --shadow-1:0 14px 36px rgba(11,18,32,.08);
      --shadow-2:0 18px 48px rgba(11,18,32,.12);
      --r-3xl:28px; --r-2xl:22px; --r-xl:18px; --r-lg:14px; --r-md:12px;
    }

    html,body{height:100%}
    body{
      background:
        radial-gradient(1200px 800px at 10% -10%, #ffffff 0%, #f7f8ff 45%, #f1f6ff 100%),
        var(--bg);
      color:var(--ink);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Noto Sans",Arial;
      line-height:1.55;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      overflow-x:hidden;
    }

    a,a:visited{color:inherit;text-decoration:none}
    a:hover{text-decoration:none}

    .fx-grid{position:fixed;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;mask-image:radial-gradient(closest-side, rgba(0,0,0,.15), transparent 70%)}
    .fx-grid::before{content:"";position:absolute;inset:-50%;background:
      linear-gradient(0deg,transparent 49.5%,rgba(0,0,0,.035) 50%,transparent 50.5%),
      linear-gradient(90deg,transparent 49.5%,rgba(0,0,0,.035) 50%,transparent 50.5%);
      background-size:40px 40px;
    }

    .shell{max-width:1180px;margin:0 auto;padding:20px}

    /* HERO */
    .hero{position:relative;border:1px solid var(--border);border-radius:var(--r-3xl);box-shadow:var(--shadow-1);padding:26px;margin-top:18px;background:rgba(255,255,255,.75);backdrop-filter:saturate(120%) blur(8px)}
    .aurora{position:absolute;inset:-60px -60px auto auto;width:360px;height:360px;background:radial-gradient(circle at 30% 30%, rgba(37,99,235,.25), rgba(16,185,129,.18) 55%, transparent 60%);filter:blur(30px);pointer-events:none}
    .hero-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}
    .title{margin:0;font-size:clamp(1.35rem,1.6vw + 1rem,2.1rem);font-weight:900;letter-spacing:-.02em}
    .tagline{margin:0;color:var(--muted)}

    .searchbar{display:flex;gap:10px;align-items:center;width:100%}
    .input{flex:1;min-width:220px;height:54px;padding:0 16px 0 50px;border-radius:16px;border:1px solid var(--border);background:#fff;outline:none;font-size:1.03rem;transition:box-shadow .15s ease, border-color .15s ease;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%23667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>');background-repeat:no-repeat;background-position:16px center}
    .input:focus{border-color:#bfd7ff;box-shadow:0 0 0 5px var(--ring)}
    .btn{height:54px;padding:0 18px;border-radius:14px;border:1px solid var(--border);background:#fff;font-weight:900;cursor:pointer;transition:transform .06s ease, box-shadow .15s ease, background .15s ease}
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 12px 24px rgba(37,99,235,.28)}
    .btn-primary:hover{filter:brightness(.98)}
    .btn-icon{width:54px;display:inline-flex;align-items:center;justify-content:center}

    /* NAV Matrix */
    .matrix{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:16px}
    .link3d{grid-column:span 6;position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px;color:inherit;border:1px solid var(--border);border-radius:22px;background:linear-gradient(180deg,#ffffff 40%, #f7f8ff 100%);box-shadow:var(--shadow-1);overflow:hidden}
    .link3d:hover{box-shadow:var(--shadow-2)}
    .link3d .txt{display:flex;flex-direction:column}
    .k{font-weight:900;font-size:clamp(1.05rem,1vw + .6rem,1.48rem);letter-spacing:-.02em}
    .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--border);background:linear-gradient(180deg,#fff,#f5f7ff);box-shadow:var(--shadow-1)}
    .ico svg{width:22px;height:22px;stroke-width:2}
    .link3d::after{content:"";position:absolute;inset:auto -10px -10px auto;width:180px;height:180px;background:conic-gradient(from 220deg, rgba(37,99,235,.15), rgba(16,185,129,.10), transparent 65%);filter:blur(18px)}

    /* Sections */
    .section{background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:var(--r-2xl);box-shadow:var(--shadow-1);padding:16px;margin-top:16px}
    .section-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .section-h h2{margin:0;font-size:1.08rem;font-weight:900;letter-spacing:-.01em;color:var(--ink)}
    .section-h a{font-weight:800;color:var(--ink)}

    /* Rails / Cards */
    .rail-wrap{position:relative}
    .rail{display:flex;gap:10px;overflow:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:6px;scroll-behavior:smooth}
    .rail::-webkit-scrollbar{height:6px}
    .rail::-webkit-scrollbar-thumb{background:#00000033;border-radius:50px}
    .card-mini{width:150px;flex:0 0 150px;scroll-snap-align:start;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-1);overflow:hidden;background:linear-gradient(180deg,#fff,#f7f9ff)}
    .card-mini img{width:100%;height:196px;object-fit:cover;background:#eef2ff}
    .card-mini .t{padding:9px 10px;font-size:.95rem;font-weight:900;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Rail nav buttons */
    .nav-btn{
      position:absolute; top:50%; transform:translateY(-50%);
      width:40px; height:40px; border-radius:50%;
      border:1px solid var(--border); background:#fff; box-shadow:var(--shadow-1);
      display:grid; place-items:center; cursor:pointer; opacity:.95;
    }
    .nav-btn[disabled]{opacity:.4; cursor:not-allowed}
    .nav-prev{left:-6px}
    .nav-next{right:-6px}
    .nav-btn svg{width:18px;height:18px}

    /* Blog */
    .blog-grid{display:flex;gap:12px;overflow:auto;padding-bottom:6px;scroll-behavior:smooth}
    .blog-card{flex:0 0 270px;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-1);overflow:hidden;background:linear-gradient(180deg,#fff,#f8faff)}
    .blog-card .cover{width:100%;height:150px;object-fit:cover;background:#eef2ff}
    .blog-card .body{padding:10px}
    .blog-card .title{font-weight:900;font-size:1.02rem;letter-spacing:-.01em;color:var(--ink);margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .blog-card .meta{color:var(--muted);font-size:.85rem}

    .center{text-align:center;color:var(--muted)}

    /* Skeletons */
    .skeleton-rail{display:flex;gap:10px;overflow:hidden}
    .sk-card{width:150px;height:240px;border-radius:16px;border:1px solid var(--border);background:linear-gradient(180deg,#fff,#f7f9ff);position:relative;overflow:hidden}
    .sk-thumb{height:196px;background:#eef2ff}
    .sk-line{height:14px;margin:8px;border-radius:6px;background:#eef2ff}
    .shimmer::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);transform:translateX(-100%);animation:shimmer 1.4s infinite}
    @keyframes shimmer{to{transform:translateX(100%)}}

    @media (prefers-reduced-motion: reduce){

    @media (max-width:680px){

    }

    .nav-prev { left: 6px; transform: translateY(-50%); }
    .nav-next { right: 6px; transform: translateY(-50%); }
    html, body { overflow-x: hidden; }
    .fx-grid { overflow: hidden; }
    .fx-grid::before { inset: 0; }

<!-- BODY — GA4 tracking per homepage (page_view, search, nav, rails + blog) -->
<script>
(function(){
  if (window.__ga4SpaTrackerInstalled) return;
  window.__ga4SpaTrackerInstalled = true;

  // Helper per banner cookie (se/quando lo aggiungi)
  window.acceptAllConsent = function(){
    gtag('consent', 'update', {
      ad_storage: 'granted',
      ad_user_data: 'granted',
      ad_personalization: 'granted',
      analytics_storage: 'granted'
    });
  };

  /* ---------- page_view manuale ---------- */
  function trackPageView(){
    gtag('event','page_view', {
      page_location: location.href,
      page_path: location.pathname + location.search,
      page_title: document.title
    });
  }

  // Non contare i cambi del solo ?q= (ricerca live)
  function normalize(url){
    try{
      var u = new URL(url, location.origin);
      u.searchParams.delete('q');
      return u.pathname + (u.search ? u.search : '');
    }catch(e){
      return location.pathname + location.search;
    }
  }
  var prevNorm;

  /* ---------- util ---------- */
  function textOr(el, fallback){ return (el && (el.textContent || el.getAttribute('aria-label') || '').trim()) || fallback; }
  function firstN(arr,n){ return Array.prototype.slice.call(arr,0,Math.max(0,n)); }

  /* ---------- view_item_list dai rail (MutationObserver 1-shot) ---------- */
  function observeRailList(railId, listName){
    var rail = document.getElementById(railId);
    if (!rail) return;
    var sent = false;
    function maybeSend(){
      if (sent) return;
      var items = rail.querySelectorAll('.card-mini');
      if (items.length >= 1){
        sent = true;
        var payload = firstN(items, 10).map(function(a){
          var t = a.querySelector('.t');
          return { item_name: textOr(t, 'item') };
        });
        gtag('event','view_item_list', { item_list_name: listName, items: payload });
      }
    }
    // prova subito (in caso il rail sia già popolato)
    maybeSend();
    // altrimenti osserva cambi
    var mo = new MutationObserver(function(){ maybeSend(); if (sent) mo.disconnect(); });
    mo.observe(rail, { childList:true, subtree:true });
  }

  document.addEventListener('DOMContentLoaded', function(){
    prevNorm = normalize(location.href);
    trackPageView();

    /* ---------- SEARCH (#q + bottone) ---------- */
    var q = document.getElementById('q');
    var go = document.getElementById('search-go');
    function fireSearch(){
      var val = (q && q.value || '').trim();
      if (!val) return;
      gtag('event','search', { search_term: val });
    }
    if (q){
      q.addEventListener('change', fireSearch);
      q.addEventListener('keydown', function(e){ if (e.key === 'Enter') fireSearch(); });
    }
    if (go){
      // usa pointerdown per provare a inviare prima della navigazione
      go.addEventListener('pointerdown', fireSearch, { passive:true });
      go.addEventListener('click', fireSearch, { passive:true });
    }

    /* ---------- NAV matrix click ---------- */
    document.addEventListener('click', function(e){
      var link = e.target.closest && e.target.closest('.matrix .link3d');
      if (!link) return;
      var name = textOr(link.querySelector('.k'), 'nav');
      gtag('event','select_content', {
        content_type: 'nav',
        item_id: 'matrix',
        item_name: name
      });
    }, true);

    /* ---------- Click sui rail (anime/manga) -> select_item ---------- */
    document.addEventListener('click', function(e){
      var card = e.target.closest && e.target.closest('#anime-rail .card-mini, #manga-rail .card-mini');
      if (!card) return;
      var listName = card.closest('#anime-rail') ? 'Anime Showcase' : 'Manga Showcase';
      var title = textOr(card.querySelector('.t'), 'item');
      gtag('event','select_item', {
        item_list_name: listName,
        items: [{ item_name: title }]
      });
    }, true);

    /* ---------- Blog: click + view list ---------- */
    // click
    document.addEventListener('click', function(e){
      var blog = e.target.closest && e.target.closest('#blog-rail .blog-card');
      if (!blog) return;
      var title = textOr(blog.querySelector('.title'), 'blog_item');
      gtag('event','select_content', {
        content_type: 'blog',
        item_id: 'blog_card',
        item_name: title
      });
    }, true);
    // view list (quando popolato dal JSONP)
    (function observeBlog(){
      var rail = document.getElementById('blog-rail');
      if (!rail) return;
      var sent = false;
      function maybeSend(){
        if (sent) return;
        var cards = rail.querySelectorAll('.blog-card');
        if (cards.length){
          sent = true;
          gtag('event','view_item_list', {
            item_list_name: 'Blog Latest',
            items: firstN(cards, 10).map(function(c){ return { item_name: textOr(c.querySelector('.title'), 'blog_item') }; })
          });
        }
      }
      maybeSend();
      var mo = new MutationObserver(function(){ maybeSend(); if (sent) mo.disconnect(); });
      mo.observe(rail, { childList:true, subtree:true });
    })();

    /* ---------- Rail nav buttons (prev/next) ---------- */
    document.addEventListener('click', function(e){
      var btn = e.target.closest && e.target.closest('.nav-btn');
      if (!btn) return;
      var railId = btn.getAttribute('data-for') || 'rail';
      var dir = btn.classList.contains('nav-next') ? 'next' : 'prev';
      gtag('event','select_content', {
        content_type: 'rail_nav',
        item_id: railId,
        item_name: dir
      });
    }, true);

    /* ---------- view_item_list: osserva i rail contenuti ---------- */
    observeRailList('anime-rail', 'Anime Showcase');
    observeRailList('manga-rail', 'Manga Showcase');
  });

  /* ---------- page_view su navigazioni SPA (se mai usate) ---------- */
  function maybeTrack(){
    var nowNorm = normalize(location.href);
    if (nowNorm !== prevNorm){
      prevNorm = nowNorm;
      trackPageView();
    }
  }
  ['pushState','replaceState'].forEach(function(m){
    var orig = history[m];
    history[m] = function(){
      var ret = orig.apply(this, arguments);
      setTimeout(maybeTrack, 0);
      return ret;
    };
  });
  window.addEventListener('popstate', maybeTrack);
})();
</script>

  <div id="footer-placeholder"></div>

  <script>
    // Header / Footer includes (non-blocking)
    fetch('header.html').then(r=>r.ok?r.text():'').then(t=>{document.getElementById('header-placeholder').innerHTML=t||''}).catch(()=>{});
    fetch('footer.html').then(r=>r.ok?r.text():'').then(t=>{document.getElementById('footer-placeholder').innerHTML=t||''}).catch(()=>{});

    // Search logic
    const q = document.getElementById('q');
    const go = document.getElementById('search-go');
    const clearBtn = document.getElementById('clear-q');
    function runSearch(){
      const val = (q.value || '').trim();
      const base = 'anime-list.html';
      location.href = val ? `${base}?q=${encodeURIComponent(val)}` : base;
    }
    q.addEventListener('keydown', e => { if(e.key === 'Enter') runSearch(); });
    go.addEventListener('click', runSearch);
    q.addEventListener('input', ()=>{ clearBtn.style.display = q.value ? 'inline-flex' : 'none'; });
    clearBtn.addEventListener('click', ()=>{ q.value=''; q.focus(); clearBtn.style.display='none'; });

    /* ===============================
       IMAGE HELPERS
       =============================== */
    const PLACEHOLDER='https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg';
    const BAD_VALUES = new Set(['', 'null', 'undefined', 'none', '[]', '{}', '-', '""', "''"]);
    const esc=s=>String(s||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
    const clean=(u)=> (u? String(u).trim().replace(/^\"+|\"+$/g,'') : '');

    function pickImageUrl(raw) {
      let s = clean(raw);
      if (!s || BAD_VALUES.has(s.toLowerCase())) return '';
      if (s.startsWith('{')) {
        try {
          const o = JSON.parse(s.replace(/\\'/g,'"'));
          s = o.large || o.medium || o.small || o.url || '';
          s = clean(s);
        } catch {}
      }
      if (s && !/^https?:\/\//i.test(s)) return '';
      return s;
    }

    function normalizeSize(u, target='hq') {
      if (!u) return '';
      const qIndex = u.indexOf('?');
      const base = qIndex >= 0 ? u.slice(0, qIndex) : u;
      const qs = qIndex >= 0 ? u.slice(qIndex) : '';
      const re = /l\.(jpe?g|png|webp)$/i;
      const hq = base.replace(re, '.$1');
      const th = base.replace(re, 't.$1');
      const out = target === 'thumb' ? th : hq;
      return (out || base) + qs;
    }

    function imgOnErrorSmart(imgEl) {
      const state = imgEl.getAttribute('data-state') || 'hq';
      const original = imgEl.getAttribute('data-original') || '';
      if (state === 'hq') {
        const t = normalizeSize(original, 'thumb');
        if (t && t !== imgEl.src) { imgEl.src = t; imgEl.setAttribute('data-state','thumb'); return; }
      }
      imgEl.src = PLACEHOLDER;
      imgEl.setAttribute('data-state','placeholder');
    }

    const slugFromMAL=(url)=>{ try{ const u=new URL(url); const p=u.pathname.split('/').filter(Boolean); return decodeURIComponent(p[p.length-1]||''); }catch{return'';} };
    const buildHref=(row,type)=>{
      const url=row.url||row.link||'';
      const slug=url? slugFromMAL(url):'';
      const base= type==='anime' ? 'anime.html' : 'manga.html';
      if(slug) return `${base}?slug=${encodeURIComponent(slug)}`;
      const id=String(row[type==='anime'?'anime_id':'manga_id']||'').trim();
      return id ? `${base}?id=${encodeURIComponent(id)}` : '#';
    };

    // Shuffle & pick N
    function takeRandom(arr, n=20){
      const a = arr.slice();
      for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
      return a.slice(0,n);
    }

    // ======= DATA ENDPOINTS =======
    const ORIGIN = window.location.origin;
    const DATA_BASE = ORIGIN + '/data/';

    const URLS = {
      anime: DATA_BASE + 'anime.csv',
      mangaCore: DATA_BASE + 'manga_core.csv',          // non usato in streaming homepage
      mangaP1: DATA_BASE + 'manga_text_part1.csv',
      mangaP2: DATA_BASE + 'manga_text_part2.csv',
    };

    // Papa streaming (scarica e parse in worker, interrompe presto)
    function streamCSV(url, {onRow, onDone, want=40, hardLimit=5000}) {
      let hits = 0;
      let seen = 0;

      // 🔒 Normalizza qualunque URL che punti ancora a animmunity.github.io/data
      let finalUrl = url;
      const legacyPrefix = 'https://animmunity.github.io/data/';
      if (finalUrl.startsWith(legacyPrefix)) {
        finalUrl = DATA_BASE + finalUrl.slice(legacyPrefix.length);
      }

      Papa.parse(finalUrl, {
        download: true,
        header: true,
        worker: true,
        skipEmptyLines: true,
        step: (results, parser) => {
          seen++;
          try {
            const keep = onRow && onRow(results.data, parser);
            if (keep) hits++;
            if (hits >= want || seen >= hardLimit) parser.abort();
          } catch(e) {
            console.warn('step error', e);
          }
        },
        complete: () => { try { onDone && onDone(); } catch{} },
        error: (err) => { console.error('stream error', err); try { onDone && onDone(err); } catch{} }
      });
    }

    function renderRail(railId, rows, type){
      const rail=document.getElementById(railId); if(!rail) return; rail.innerHTML='';
      const sample = takeRandom(rows, 20);
      sample.forEach(r=>{
        const title = (r.title || r.title_english || r.title_japanese || 'Untitled').trim() || 'Untitled';
        const raw   = pickImageUrl(r.main_picture || r.image_url || r.image || r.thumbnail || '');
        const src   = normalizeSize(raw, 'hq') || PLACEHOLDER;
        const a=document.createElement('a');
        a.className='card-mini';
        a.href=buildHref(r,type);
        a.setAttribute('role','option');
        a.setAttribute('aria-label',title);
        a.innerHTML = `
          <img loading="lazy" decoding="async"
               src="${esc(src)}"
               data-original="${esc(raw)}"
               onerror="imgOnErrorSmart(this)"
               alt="${esc(title)}">
          <div class="t" title="${esc(title)}">${esc(title)}</div>`;
        rail.appendChild(a);
      });
      updateRailNavState(railId);
    }

    // Skeleton helpers
    function showRailSkeleton(railId, count=8){
      const rail=document.getElementById(railId); if(!rail) return;
      rail.innerHTML='';
      const wrap=document.createElement('div');
      wrap.className='skeleton-rail';
      for(let i=0;i<count;i++){
        const c=document.createElement('div'); c.className='sk-card shimmer';
        c.innerHTML='<div class="sk-thumb"></div><div class="sk-line"></div>';
        wrap.appendChild(c);
      }
      rail.appendChild(wrap);
    }
    function clearRailSkeleton(railId){
      const rail=document.getElementById(railId); if(!rail) return;
      rail.innerHTML='';
    }

    /* ==== Rail nav (frecce) ==== */
    function scrollRailBy(railId, dir=1){
      const rail = document.getElementById(railId); if(!rail) return;
      const delta = Math.max(rail.clientWidth * 0.9, 300) * dir;
      rail.scrollBy({left: delta, behavior:'smooth'});
    }
    function updateRailNavState(railId){
      const rail = document.getElementById(railId); if(!rail) return;
      const wrap = rail.parentElement;
      const prev = wrap.querySelector('.nav-prev[data-for="'+railId+'"]');
      const next = wrap.querySelector('.nav-next[data-for="'+railId+'"]');
      const max = Math.max(0, rail.scrollWidth - rail.clientWidth - 1);
      const x = rail.scrollLeft;
      if (prev) prev.disabled = x <= 0;
      if (next) next.disabled = x >= max;
    }
    function setupRailNav(railId){
      const rail = document.getElementById(railId); if(!rail) return;
      const wrap = rail.parentElement;
      const prev = wrap.querySelector('.nav-prev[data-for="'+railId+'"]');
      const next = wrap.querySelector('.nav-next[data-for="'+railId+'"]');
      if (prev) prev.addEventListener('click', ()=>scrollRailBy(railId, -1));
      if (next) next.addEventListener('click', ()=>scrollRailBy(railId, +1));
      rail.addEventListener('scroll', ()=>updateRailNavState(railId), {passive:true});
      window.addEventListener('resize', ()=>updateRailNavState(railId));
      updateRailNavState(railId);
    }

    /* ===============================
       DATA BOOT (streaming + abort)
       =============================== */
    document.addEventListener('DOMContentLoaded', ()=>{
      // Prepare navigation for rails
      setupRailNav('anime-rail');
      setupRailNav('manga-rail');
      setupRailNav('blog-rail');

      // Skeletons
      showRailSkeleton('anime-rail', 10);
      showRailSkeleton('manga-rail', 10);

      // --- Anime: stream finché abbiamo abbastanza elementi ---
      const animeCandidates = [];
      streamCSV(URLS.anime, {
        onRow: (row) => {
          const id = String(row.anime_id||'').trim();
          const title = (row.title || row.title_english || row.title_japanese || '').trim();
          if (!id || !title) return false;
          const pic = pickImageUrl(row.main_picture || row.image_url || row.image || '');
          animeCandidates.push({ ...row, anime_id:id, title, main_picture:pic, url:row.url||'' });
          return true;
        },
        onDone: () => {
          clearRailSkeleton('anime-rail');
          renderRail('anime-rail', animeCandidates, 'anime');
        },
        want: 40,        // raccogli 40 → ne mostriamo 20 random
        hardLimit: 4000  // non parse oltre 4000 righe del CSV
      });

      // --- Manga: stream solo le text parts (contengono main_picture/URL) ---
      const mangaCandidates = [];
      const doneIfReady = () => {
        if (mangaCandidates.length >= 40) {
          clearRailSkeleton('manga-rail');
          renderRail('manga-rail', mangaCandidates, 'manga');
          return true;
        }
        return false;
      };

      // part1
      streamCSV(URLS.mangaP1, {
        onRow: (row) => {
          const id = String(row.manga_id||'').trim();
          const title = (row.title_english || row.title_japanese || '').trim();
          const pic = pickImageUrl(row.main_picture || '');
          if (!id || !title) return false;
          mangaCandidates.push({ manga_id:id, title, title_english:row.title_english, title_japanese:row.title_japanese, main_picture:pic, url:row.url||'' });
          return true;
        },
        onDone: () => {
          if (doneIfReady()) return;
          // part2 only if needed
          streamCSV(URLS.mangaP2, {
            onRow: (row) => {
              const id = String(row.manga_id||'').trim();
              const title = (row.title_english || row.title_japanese || '').trim();
              const pic = pickImageUrl(row.main_picture || '');
              if (!id || !title) return false;
              mangaCandidates.push({ manga_id:id, title, title_english:row.title_english, title_japanese:row.title_japanese, main_picture:pic, url:row.url||'' });
              return true;
            },
            onDone: () => {
              clearRailSkeleton('manga-rail');
              renderRail('manga-rail', mangaCandidates, 'manga');
            },
            want: 40,
            hardLimit: 4000
          });
        },
        want: 40,
        hardLimit: 4000
      });

      // Blogger feed via JSONP (CORS-safe, HTTPS-only)
      (function loadBlogger(){
        const status=document.getElementById('blog-status');
        const rail=document.getElementById('blog-rail');
        if(!rail) return;

        // skeletons
        rail.innerHTML='';
        const sk=document.createElement('div'); sk.className='skeleton-rail';
        for(let i=0;i<4;i++){
          const c=document.createElement('div'); c.className='sk-card shimmer';
          c.style.width='270px'; c.style.height='210px';
          c.innerHTML='<div class="sk-thumb" style="height:150px"></div><div class="sk-line" style="height:16px"></div>';
          sk.appendChild(c);
        }
        rail.appendChild(sk);
        status.textContent='Loading posts…';

        window.__bloggerCB=function(json){
          try{
            const entries=(json&&json.feed&&json.feed.entry)? json.feed.entry : [];
            rail.innerHTML='';
            if(!entries.length){ status.textContent='No articles found.'; updateRailNavState('blog-rail'); return; }
            entries.slice(0,12).forEach(e=>{
              const title=(e.title&&e.title.$t)||'Article';
              const link=(e.link||[]).find(l=>l.rel==='alternate')?.href||'#';
              const thumb=(e['media$thumbnail']&&e['media$thumbnail'].url)||PLACEHOLDER;
              const dateStr=(e.published&&e.published.$t)||'';
              const d=dateStr? new Date(dateStr):null;
              const nice=d? d.toLocaleDateString('en-GB',{year:'numeric',month:'short',day:'2-digit'}) : '';
              const a=document.createElement('a');
              a.className='blog-card';
              a.href=link; a.target='_blank'; a.rel='noopener';
              a.innerHTML = `<img class="cover" src="${esc(thumb)}" alt="${esc(title)}"><div class="body"><h3 class="title">${esc(title)}</h3><div class="meta">${esc(nice)}</div></div>`;
              rail.appendChild(a);
            });
            status.textContent='';
            updateRailNavState('blog-rail');
          }catch(err){ status.textContent='Unable to load posts.'; }
        };
        const s=document.createElement('script');
        s.src='https://animmunity.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=12&callback=__bloggerCB';
        s.async=true;
        s.onerror=()=>{ status.textContent='Feed unavailable.'; };
        document.body.appendChild(s);
      })();
    });
  </script>
</body>
</html>
