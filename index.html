<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>AniMMUnity — Explore Anime & Manga</title>
  <meta name="description" content="Explore AniMMUnity — browse anime lists, manga lists, and top rankings.">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="styles.css">

  <style>
    /* ====== Layout base dell’index ====== */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }
    .page-title {
      text-align: center;
      margin: 8px 0 20px;
    }
    .page-subtitle {
      text-align: center;
      color: #444;
      margin: 0 0 28px;
    }

    /* ====== Griglia nav come in esempio ====== */
    .nav-buttons {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(12, 1fr);
      align-items: stretch;
    }
    /* Blocchi responsive (full/half) come il tuo “pk-card-button” */
    .nav-buttons > .full { grid-column: span 12; }
    .nav-buttons > .half { grid-column: span 6; }
    @media (max-width: 900px) {
      .nav-buttons > .half { grid-column: span 12; }
    }

    /* ====== Bottoni stile tuo snippet ====== */
    body .nav-buttons>* .card-btn.primary { background-color: #fe3b4c; color: #fff; }
    body .nav-buttons>* .card-btn.info    { background-color: #00a2ff; color: #fff; }
    body .nav-buttons>* .card-btn.success { background-color: #2ecc71; color: #fff; }
    body .nav-buttons>* .card-btn.warning { background-color: #f39c12; color: #fff; }
    body .nav-buttons>* .card-btn.secondary { background-color: #7b8ba3; color: #fff; }

    body .nav-buttons>* .card-btn {
      cursor: pointer;
      display: flex;
      position: relative;
      justify-content: space-between;
      align-items: center;
      border-radius: 20px;
      padding: 2rem;
      font-size: 36px;          /* 50px era molto grande su mobile: riduco un po’ */
      font-weight: 700;
      color: #fff;
      text-decoration: none;    /* per i <a> */
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .card-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(0,0,0,.12); }
    .card-btn img { width: 64px; height: 64px; object-fit: contain; margin-right: 16px; }

    /* Piccoli spazi laterali “space-left/right” opzionali */
    .space-left  { margin-left: 10px; }
    .space-right { margin-right: 10px; }

    /* Tipografia base (coerente con le tue pagine) */
    body {
      font-family: "Nunito Sans", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 16px;
      font-weight: 400;
      line-height: 1.575;
      color: #000;
      margin: 0;
      background-color: #fff;
      overflow: auto;
      height: 100dvh;
    }

    /* Scrollbar (come nel tuo snippet) */
    ::-webkit-scrollbar { height: 5px; width: 5px; }
    ::-webkit-scrollbar-thumb { cursor: default; background: #0000004d; border-radius: 50px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header-placeholder"></div>

  <main>
    <h1 class="page-title">Welcome to AniMMUnity</h1>
    <p class="page-subtitle">Explore our anime and manga sections, browse top lists, and discover new favorites.</p>

    <!-- NAV BUTTONS -->
    <div class="nav-buttons">
      <!-- FULL BUTTON: Anime List -->
      <div class="full">
        <a class="card-btn primary" href="anime-list.html" aria-label="Go to Anime List">
          <span style="display:flex;align-items:center;gap:16px;">
            <img src="assets/images/card/dex.svg" alt="" loading="lazy">
            Anime List
          </span>
          <span aria-hidden="true">→</span>
        </a>
      </div>

      <!-- HALF BUTTONS: Top Anime / Top Manga -->
      <div class="half space-right">
        <a class="card-btn info" href="top-anime.html" aria-label="Go to Top Anime">
          <span style="display:flex;align-items:center;gap:16px;">
            <img src="assets/images/card/abilities.svg" alt="" loading="lazy">
            Top Anime
          </span>
          <span aria-hidden="true">→</span>
        </a>
      </div>
      <div class="half space-left">
        <a class="card-btn success" href="top-manga.html" aria-label="Go to Top Manga">
          <span style="display:flex;align-items:center;gap:16px;">
            <img src="assets/images/card/moves.svg" alt="" loading="lazy">
            Top Manga
          </span>
          <span aria-hidden="true">→</span>
        </a>
      </div>

      <!-- FULL BUTTON: Manga List -->
      <div class="full">
        <a class="card-btn warning" href="manga-list.html" aria-label="Go to Manga List">
          <span style="display:flex;align-items:center;gap:16px;">
            <img src="assets/images/card/bag.svg" alt="" loading="lazy">
            Manga List
          </span>
          <span aria-hidden="true">→</span>
        </a>
      </div>

      <!-- (Opzionale) FULL extra: Sitemap/About/News ecc. -->
      <!--
      <div class="full">
        <a class="card-btn secondary" href="sitemap.xml">
          <span style="display:flex;align-items:center;gap:16px;">
            <img src="assets/images/card/pocket.svg" alt="" loading="lazy">
            Sitemap
          </span>
          <span aria-hidden="true">→</span>
        </a>
      </div>
      -->
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script>
    // Carica header/footer senza bloccare la pagina
    fetch("header.html").then(r => r.ok ? r.text() : "").then(h => {
      document.getElementById("header-placeholder").innerHTML = h || "";
      const toggle = document.querySelector('.menu-toggle');
      const headerInner = document.querySelector('.header-inner');
      if (toggle && headerInner) toggle.addEventListener("click", () => headerInner.classList.toggle("active"));
    }).catch(() => { /* fallback vuoto */ });

    fetch("footer.html").then(r => r.ok ? r.text() : "").then(f => {
      document.getElementById("footer-placeholder").innerHTML = f || "";
    }).catch(() => { /* fallback vuoto */ });
  </script>
</body>
</html>
