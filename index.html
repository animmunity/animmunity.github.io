<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AniMMUnity — Home</title>
  <meta name="description" content="Discover AniMMUnity: fast search, clean filters and rankings for Anime & Manga. Random showcases with 20 covers each, plus latest blog posts."/>
  <meta name="theme-color" content="#ffffff" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>
  <link rel="stylesheet" href="/styles.css" />

  <style>
  /* === Apple-style, understated, tactile === */
  :root{
    /* neutrals */
    --bg:#f5f5f7; --ink:#0f172a; --muted:#6b7280; --panel:#ffffff; --panel-2:#fbfbfd; --border:#e5e7eb;
    --r-xl:28px; --r-lg:18px; --r-md:14px; --r-sm:10px;
    --shadow-1:0 8px 26px rgba(17,24,39,.06); --shadow-2:0 12px 40px rgba(17,24,39,.08);

    /* Apple-like accents */
    --blue:#0a84ff;     --blue-ink:#ffffff;    --blue-ghost:#e8f1ff;  --blue-border:#cfe3ff;
    --indigo:#5856d6;   --indigo-ink:#ffffff;  --indigo-ghost:#ecebff;--indigo-border:#dddafc;
    --green:#34c759;    --green-ink:#0f172a;   --green-ghost:#e9f9ef; --green-border:#d2f1dd;
    --orange:#ff9f0a;   --orange-ink:#0f172a;  --orange-ghost:#fff3e6;--orange-border:#ffe0bf;
    --focus:#0a84ff40;  /* focus ring */
  }
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Noto Sans","Helvetica Neue",Arial}
  .shell{max-width:1200px;margin:0 auto;padding:16px}

  /* ======= Search block ======= */
  .section{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:16px;margin-top:16px}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}

  .search-section{padding:0}
  .search-card{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--r-lg);
               background:linear-gradient(180deg,var(--panel),var(--panel-2));
               border:1px solid var(--border)}
  .search-input{flex:1;font-size:1.05rem;padding:14px 16px 14px 44px;border-radius:14px;border:1px solid var(--border);
                background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%2399a1ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat 14px center;
                outline:none;transition:border-color .15s ease, box-shadow .15s ease}
  .search-input:focus{border-color:#bcd7ff;box-shadow:0 0 0 4px var(--focus)}
  .search-actions{display:flex;gap:8px}
  .btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);font-weight:600;cursor:pointer;transition:transform .06s ease, box-shadow .15s ease, background .15s ease}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(10,132,255,.25)}
  .btn-primary:hover{background:#0077f5}
  .btn-ghost{background:#fff;color:var(--ink)}
  .btn-ghost:hover{background:#f2f2f6}
  .btn-icon{width:44px;display:inline-flex;align-items:center;justify-content:center}

  /* ======= Tiles (tinted, Apple-ish) ======= */
  .tiles{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:18px}
  .tile{grid-column:span 6;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px;border-radius:22px;border:1px solid var(--border);box-shadow:var(--shadow-1);text-decoration:none;position:relative;isolation:isolate;background:var(--panel)}
  .tile .label{font-size:clamp(1.1rem,1vw + .6rem,1.5rem);font-weight:900;letter-spacing:-.02em}
  .tile small{display:block;opacity:.95;font-weight:600;color:var(--muted)}
  .tile:hover{box-shadow:var(--shadow-2)}
  @media (max-width: 920px){.tile{grid-column:span 12}}

  /* tinted variants */
  .tile.rose{background:var(--blue-ghost);border-color:var(--blue-border)}
  .tile.lilac{background:var(--indigo-ghost);border-color:var(--indigo-border)}
  .tile.aqua{background:var(--green-ghost);border-color:var(--green-border)}
  .tile.peach{background:var(--orange-ghost);border-color:var(--orange-border)}
  .tile.rose .label{color:#0a84ff}
  .tile.lilac .label{color:#5856d6}
  .tile.aqua .label{color:#34c759}
  .tile.peach .label{color:#ff9f0a}

  /* chevron */
  .tile::after{content:"";position:absolute;right:20px;top:50%;transform:translateY(-50%) rotate(45deg);width:10px;height:10px;border-right:3px solid currentColor;border-top:3px solid currentColor;opacity:.25}

  /* Rails & cards */
  .rail{display:flex;gap:10px;overflow:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .rail::-webkit-scrollbar{height:6px}
  .rail::-webkit-scrollbar-thumb{background:#00000033;border-radius:50px}
  .card-mini{width:140px;flex:0 0 140px;scroll-snap-align:start;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-1);overflow:hidden}
  .card-mini img{width:100%;height:186px;object-fit:cover;background:#e9ecf6}
  .card-mini .t{padding:8px;font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Blog */
  .blog-grid{display:flex;gap:12px;overflow:auto;padding-bottom:6px}
  .blog-card{flex:0 0 260px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-1);overflow:hidden;display:flex;flex-direction:column}
  .blog-card .cover{width:100%;height:150px;object-fit:cover;background:#e9ecf6}
  .blog-card .body{padding:10px}
  .blog-card .title{font-weight:800;font-size:1rem;margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .blog-card .meta{color:var(--muted);font-size:.85rem}
  .center{text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <!-- Header slot -->
  <div id="header-placeholder"></div>

  <main class="shell">
    <!-- Search in its own block -->
    <section class="section search-section" aria-label="Search">
      <div class="search-card">
        <input id="q" class="search-input" type="search" placeholder="Search a title…" autocomplete="off" />
        <div class="search-actions">
          <button id="clear-q" class="btn btn-ghost btn-icon" title="Clear" aria-label="Clear" style="display:none">
            <!-- × icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <button id="search-go" class="btn btn-primary" aria-label="Search">Search</button>
        </div>
      </div>
    </section>

    <!-- Main tiles -->
    <section class="tiles" aria-label="Main sections">
      <a class="tile rose" href="/anime-list.html">
        <div>
          <div class="label">Anime List</div>
          <small>Genres, themes & more</small>
        </div>
      </a>
      <a class="tile lilac" href="/manga-list.html">
        <div>
          <div class="label">Manga List</div>
          <small>Demographics & genres</small>
        </div>
      </a>
      <a class="tile aqua" href="/top-anime.html">
        <div>
          <div class="label">Top Anime</div>
          <small>Scores, members, rank</small>
        </div>
      </a>
      <a class="tile peach" href="/top-manga.html">
        <div>
          <div class="label">Top Manga</div>
          <small>Fixed global ranks</small>
        </div>
      </a>
    </section>

    <!-- BLOG first -->
    <section class="section" aria-label="Latest blog posts">
      <div class="section-title">
        <h2 style="margin:0">Latest articles</h2>
        <a href="https://animmunity.blogspot.com/" target="_blank" rel="noopener">open blog →</a>
      </div>
      <div id="blog-rail" class="blog-grid"></div>
      <div id="blog-status" class="center" style="padding:10px"></div>
    </section>

    <!-- Anime showcase -->
    <section class="section" aria-label="Anime showcase">
      <div class="section-title">
        <h2 style="margin:0">Anime showcase</h2>
        <a href="/anime-list.html">see all →</a>
      </div>
      <div class="rail" id="anime-rail" role="listbox" aria-label="Anime covers"></div>
    </section>

    <!-- Manga showcase -->
    <section class="section" aria-label="Manga showcase">
      <div class="section-title">
        <h2 style="margin:0">Manga showcase</h2>
        <a href="/manga-list.html">see all →</a>
      </div>
      <div class="rail" id="manga-rail" role="listbox" aria-label="Manga covers"></div>
    </section>
  </main>

  <!-- Footer slot -->
  <div id="footer-placeholder"></div>

  <script>
    // Header / Footer include (non-blocking)
    fetch('header.html').then(r=>r.ok?r.text():'').then(t=>{document.getElementById('header-placeholder').innerHTML=t||''}).catch(()=>{});
    fetch('footer.html').then(r=>r.ok?r.text():'').then(t=>{document.getElementById('footer-placeholder').innerHTML=t||''}).catch(()=>{});

    // Search logic
    const q = document.getElementById('q');
    const go = document.getElementById('search-go');
    const clearBtn = document.getElementById('clear-q');
    function runSearch(){
      const val = (q.value || '').trim();
      const base = 'anime-list.html';
      location.href = val ? `${base}?q=${encodeURIComponent(val)}` : base;
    }
    q.addEventListener('keydown', e => { if(e.key === 'Enter') runSearch(); });
    go.addEventListener('click', runSearch);
    q.addEventListener('input', ()=>{ clearBtn.style.display = q.value ? 'inline-flex' : 'none'; });
    clearBtn.addEventListener('click', ()=>{ q.value=''; q.focus(); clearBtn.style.display='none'; });

    // Helpers
    const PLACEHOLDER='https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg';
    const esc=s=>String(s||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
    const clean=(u)=> (u? String(u).trim().replace(/^\"+|\"+$/g,'') : '');
    const toHQ=(u)=>{const x=clean(u); return x? x.replace(/l(\.(?:jpe?g|png))$/i,'$1') : '';};
    const toThumb=(u)=>{const x=clean(u); return x? x.replace(/l(\.(?:jpe?g|png))$/i,'t$1') : '';};
    function imgOnErrorSmart(imgEl, original){
      const cur=imgEl.getAttribute('data-state')||'hq';
      if(cur==='hq'){
        const t=toThumb(original);
        if(t && t!==imgEl.src){ imgEl.src=t; imgEl.setAttribute('data-state','thumb'); return; }
      }
      imgEl.src=PLACEHOLDER; imgEl.setAttribute('data-state','placeholder');
    }
    const slugFromMAL=(url)=>{ try{ const u=new URL(url); const p=u.pathname.split('/').filter(Boolean); return decodeURIComponent(p[p.length-1]||''); }catch{return'';} };
    const buildHref=(row,type)=>{
      const url=row.url||row.link||'';
      const slug=url? slugFromMAL(url):'';
      const base= type==='anime' ? 'anime.html' : 'manga.html';
      if(slug) return `${base}?slug=${encodeURIComponent(slug)}`;
      const id=String(row[type==='anime'?'anime_id':'manga_id']||'').trim();
      return id ? `${base}?id=${encodeURIComponent(id)}` : '#';
    };
    const pick20=(arr)=>{const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a.slice(0,20)};

    // CSV loader
    function loadCSV(url){
      return fetch(url,{mode:'cors',credentials:'omit'})
        .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
        .then(t=> Papa.parse(t,{header:true,skipEmptyLines:true}).data);
    }

    function renderRail(railId, rows, type){
      const rail=document.getElementById(railId); if(!rail) return; rail.innerHTML='';
      pick20(rows.filter(r=> (r.main_picture||'').trim()!=='')).forEach(r=>{
        const title = r.title || r.title_english || r.title_japanese || 'Untitled';
        const raw = r.main_picture || r.image_url || r.image || '';
        const src = toHQ(raw) || toThumb(raw) || PLACEHOLDER;
        const a=document.createElement('a');
        a.className='card-mini';
        a.href=buildHref(r,type);
        a.setAttribute('role','option');
        a.setAttribute('aria-label',title);
        a.innerHTML=`<img loading="lazy" decoding="async" src="${esc(src)}" onerror="imgOnErrorSmart(this,'${esc(raw)}')" alt="${esc(title)}"><div class="t" title="${esc(title)}">${esc(title)}</div>`;
        rail.appendChild(a);
      });
    }

    // Data boot
    document.addEventListener('DOMContentLoaded', ()=>{
      // Manga (merge)
      Promise.allSettled([
        loadCSV('data/manga_core.csv'),
        loadCSV('data/manga_text_part1.csv'),
        loadCSV('data/manga_text_part2.csv')
      ]).then(([coreP,d1P,d2P])=>{
        if(coreP.status!=='fulfilled') return;
        const core=(coreP.value||[]).map(r=>({...r, manga_id:String(r.manga_id||'').trim()}));
        const d1=(d1P.value||[]).map(r=>({...r, manga_id:String(r.manga_id||'').trim()}));
        const d2=(d2P.value||[]).map(r=>({...r, manga_id:String(r.manga_id||'').trim()}));
        const map=new Map();
        [...d1,...d2].forEach(row=>{
          if(!row.manga_id) return;
          const prev=map.get(row.manga_id)||{};
          const merged={...prev};
          for(const k of Object.keys(row)){
            const nv=row[k], ov=prev[k];
            merged[k]= (!ov || String(nv||'').length>String(ov||'').length)? nv:ov;
          }
          map.set(row.manga_id, merged);
        });
        const rows = core.map(c=>{
          const det=map.get(c.manga_id)||{};
          return { ...c, ...det,
            title:(c.title||det.title||'').trim()||'Untitled',
            main_picture:String(det.main_picture||c.main_picture||'').trim(),
            url:det.url||c.url||''
          };
        });
        if(rows.length) renderRail('manga-rail', rows, 'manga');
      }).catch(()=>{});

      // Anime (single CSV)
      loadCSV('data/anime.csv').then(core=>{
        const rows=(core||[]).map(r=>({
          ...r,
          anime_id:String(r.anime_id||'').trim(),
          title:(r.title||r.title_english||r.title_japanese||'').trim()||'Untitled',
          main_picture:String(r.main_picture||r.image_url||'').trim(),
          url:r.url||''
        }));
        if(rows.length) renderRail('anime-rail', rows, 'anime');
      }).catch(()=>{});

      // Blogger feed via JSONP (CORS-safe)
      (function loadBlogger(){
        const status=document.getElementById('blog-status');
        const rail=document.getElementById('blog-rail');
        if(!rail) return;
        status.textContent='Loading posts…';
        window.__bloggerCB=function(json){
          try{
            const entries=(json&&json.feed&&json.feed.entry)? json.feed.entry : [];
            rail.innerHTML='';
            if(!entries.length){ status.textContent='No articles found.'; return; }
            entries.slice(0,8).forEach(e=>{
              const title=(e.title&&e.title.$t)||'Article';
              const link=(e.link||[]).find(l=>l.rel==='alternate')?.href||'#';
              const thumb=(e['media$thumbnail']&&e['media$thumbnail'].url)||PLACEHOLDER;
              const dateStr=(e.published&&e.published.$t)||'';
              const d=dateStr? new Date(dateStr):null;
              const nice=d? d.toLocaleDateString('en-GB',{year:'numeric',month:'short',day:'2-digit'}) : '';
              const a=document.createElement('a');
              a.className='blog-card';
              a.href=link; a.target='_blank'; a.rel='noopener';
              a.innerHTML=`<img class="cover" src="${esc(thumb)}" alt="${esc(title)}"><div class="body"><h3 class="title">${esc(title)}</h3><div class="meta">${esc(nice)}</div></div>`;
              rail.appendChild(a);
            });
            status.textContent='';
          }catch(err){ status.textContent='Unable to load posts.'; }
        };
        const s=document.createElement('script');
        s.src='https://animmunity.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=8&callback=__bloggerCB';
        s.async=true;
        s.onerror=()=>{ status.textContent='Feed unavailable.'; };
        document.body.appendChild(s);
      })();
    });
  </script>
</body>
</html>
