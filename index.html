<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>AniMMUnity — Explore Anime & Manga</title>
  <meta name="description" content="Explore AniMMUnity — browse anime lists, manga lists, and top rankings.">

  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">

  <!-- tua stylesheet globale -->
  <link rel="stylesheet" href="styles.css"/>

  <style>
    /* ========= Hero & layout ========= */
    body {
      font-family: "Nunito Sans", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background:
        radial-gradient(1200px 700px at 100% -10%, rgba(0,0,0,.05), transparent 60%),
        radial-gradient(900px 600px at -10% 110%, rgba(0,0,0,.05), transparent 60%),
        #fff;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    .hero {
      position: relative;
      border-radius: 24px;
      padding: 28px 24px;
      color: #fff;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      background:
        linear-gradient(135deg, var(--fire) 0%, var(--electric) 55%, var(--water) 100%);
    }
    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: .2px;
    }
    .hero p {
      margin: 0;
      opacity: .95;
      font-size: clamp(16px, 2.2vw, 18px);
    }
    .hero-badges {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .badge {
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    /* ========= Cards (stile coerente ai tuoi .card-btn) ========= */
    .sections {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px;
      margin-top: 26px;
    }
    .tile {
      grid-column: span 6; /* default mezzo */
      display: block;
      position: relative;
      border-radius: 22px;
      padding: clamp(18px, 3vw, 28px);
      text-decoration: none;
      color: #fff;
      box-shadow: 0 8px 22px rgba(0,0,0,.12);
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
      overflow: hidden;
    }
    .tile:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(0,0,0,.18); }
    .tile:active { transform: translateY(-1px) scale(.995); }

    .tile.full { grid-column: span 12; }
    @media (max-width: 900px) { .tile { grid-column: span 12; } }

    .tile-inner {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .tile-title {
      display: flex; align-items: center; gap: 14px;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 800;
      letter-spacing: .2px;
    }
    .tile-title img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.18)); }

    .tile-cta {
      font-size: 24px;
      font-weight: 900;
      opacity: .95;
    }

    /* Varianti colore (coerenti con palette “type”) */
    .tile.fire     { background: linear-gradient(135deg, var(--fire), #ff6b6b); }
    .tile.water    { background: linear-gradient(135deg, var(--water), #4db4ff); }
    .tile.grass    { background: linear-gradient(135deg, var(--grass), #48c774); }
    .tile.electric { background: linear-gradient(135deg, var(--electric), #ffd166); }
    .tile.psychic  { background: linear-gradient(135deg, var(--psychic), #ff8fab); }
    .tile.steel    { background: linear-gradient(135deg, var(--steel), #85b6c6); }

    /* Piccola “shine” decorativa */
    .tile::after {
      content: "";
      position: absolute;
      inset: -20%;
      background: radial-gradient(600px 200px at 120% -20%, rgba(255,255,255,.28), transparent 60%),
                  radial-gradient(400px 160px at -10% 120%, rgba(255,255,255,.18), transparent 60%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    /* ========= Sezione utilità (discreta) ========= */
    .utils {
      display: grid; gap: 12px; margin-top: 18px;
      grid-template-columns: repeat(12, 1fr);
    }
    .utils a {
      grid-column: span 6;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #e9ecef;
      padding: 10px 14px;
      color: #111;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0,0,0,.06);
      transition: transform .14s ease, box-shadow .14s ease;
    }
    .utils a:hover { transform: translateY(-2px); box-shadow: 0 10px 18px rgba(0,0,0,.10); }
    @media (max-width: 900px) { .utils a { grid-column: span 12; } }
  </style>
</head>
<body>

  <!-- Header (non blocca il rendering) -->
  <div id="header-placeholder"></div>

  <main>
    <!-- HERO -->
    <section class="hero" aria-label="Intro">
      <h1>AniMMUnity</h1>
      <p>Search, filter, and rank your favorite Anime & Manga with a fast, clean interface.</p>
      <div class="hero-badges">
        <span class="badge">Fast Filters</span>
        <span class="badge">Clean Cards</span>
        <span class="badge">Top Rankings</span>
      </div>
    </section>

    <!-- NAV CARDS -->
    <section class="sections" aria-label="Main navigation">
      <!-- Anime List (full) -->
      <a href="anime-list.html" class="tile full fire" aria-label="Go to Anime List">
        <div class="tile-inner">
          <div class="tile-title">
            <img src="assets/images/card/dex.svg" alt="" loading="lazy">
            Anime List
          </div>
          <div class="tile-cta">→</div>
        </div>
      </a>

      <!-- Top Anime (half) -->
      <a href="top-anime.html" class="tile electric" aria-label="Go to Top Anime">
        <div class="tile-inner">
          <div class="tile-title">
            <img src="assets/images/card/abilities.svg" alt="" loading="lazy">
            Top Anime
          </div>
          <div class="tile-cta">→</div>
        </div>
      </a>

      <!-- Top Manga (half) -->
      <a href="top-manga.html" class="tile grass" aria-label="Go to Top Manga">
        <div class="tile-inner">
          <div class="tile-title">
            <img src="assets/images/card/moves.svg" alt="" loading="lazy">
            Top Manga
          </div>
          <div class="tile-cta">→</div>
        </div>
      </a>

      <!-- Manga List (full) -->
      <a href="manga-list.html" class="tile full water" aria-label="Go to Manga List">
        <div class="tile-inner">
          <div class="tile-title">
            <img src="assets/images/card/bag.svg" alt="" loading="lazy">
            Manga List
          </div>
          <div class="tile-cta">→</div>
        </div>
      </a>
    </section>

    <!-- Utilità (opzionale) -->
    <nav class="utils" aria-label="Utilities">
      <a href="sitemap.xml" aria-label="Open sitemap.xml">Sitemap.xml</a>
      <a href="robots.txt" aria-label="Open robots.txt">Robots.txt</a>
    </nav>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script>
    // Carica header/footer; se falliscono, la pagina resta comunque fruibile
    fetch("header.html").then(r => r.ok ? r.text() : "").then(h => {
      document.getElementById("header-placeholder").innerHTML = h || "";
      const toggle = document.querySelector('.menu-toggle');
      const headerInner = document.querySelector('.header-inner');
      if (toggle && headerInner) toggle.addEventListener("click", () => headerInner.classList.toggle("active"));
    }).catch(()=>{});

    fetch("footer.html").then(r => r.ok ? r.text() : "").then(f => {
      document.getElementById("footer-placeholder").innerHTML = f || "";
    }).catch(()=>{});
  </script>
</body>
</html>
