<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AniMMUnity — Home</title>
  <meta name="description" content="Scopri anime e manga con una navigazione veloce, filtri rapidi e classifiche.">

  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="styles.css"/>

  <style>
    /* ===== Base & Typography ===== */
    :root{
      /* Pastel fallback (se il browser non supporta color-mix) */
      --pastel-fire:     #ffd6bf; /* da var(--fire) schiarito */
      --pastel-water:    #cfe8ff;
      --pastel-grass:    #d9f3da;
      --pastel-electric: #fff4bf;
      --pastel-psychic:  #ffd8e0;
      --pastel-steel:    #d6e8ef;
    }
    body{
      font-family: "Nunito Sans", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:#0e0e0e; background:
        radial-gradient(1100px 700px at 120% -10%, rgba(0,0,0,.04), transparent 60%),
        radial-gradient(900px 600px at -10% 110%, rgba(0,0,0,.04), transparent 60%),
        #fff;
      margin:0;
    }
    main{ max-width:1120px; margin:0 auto; padding:24px 18px 56px; }

    /* ===== Hero ===== */
    .hero{
      position:relative; overflow:hidden;
      border-radius:28px; padding:28px 24px;
      box-shadow:0 10px 26px rgba(0,0,0,.10);
      background:
        linear-gradient(135deg, #fff 0%, #f8faff 35%, #fff 100%);
    }
    .hero h1{
      margin:0 0 6px; font-weight:900;
      font-size: clamp(28px, 4.5vw, 46px);
      letter-spacing:.2px;
    }
    .hero p{ margin:0; color:#444; font-size: clamp(15px, 2.4vw, 18px); }
    .hero-badges{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
    .badge{
      padding:6px 12px; font-weight:800; font-size:13px; letter-spacing:.2px;
      border-radius:999px; color:#222;
      background: rgba(255,255,255,.7);
      border:1px solid #e9edf3;
      box-shadow:0 4px 12px rgba(0,0,0,.06);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* ===== Grid di navigazione ===== */
    .sections{
      margin-top:24px;
      display:grid; gap:20px; grid-template-columns: repeat(12, 1fr);
    }
    .tile{ grid-column: span 6; text-decoration:none; color:inherit; }
    .tile.full{ grid-column: span 12; }
    @media (max-width: 920px){
      .tile, .tile.full{ grid-column: span 12; }
    }

    /* ===== Card Pastello ===== */
    .card{
      position:relative; overflow:hidden;
      border-radius:24px; padding: clamp(18px, 3vw, 28px);
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      box-shadow: 0 10px 24px rgba(0,0,0,.10);
      transition: transform .16s ease, box-shadow .16s ease;
      border:1px solid rgba(0,0,0,.05);
    }
    .card:hover{ transform: translateY(-4px); box-shadow:0 16px 34px rgba(0,0,0,.16); }
    .card:active{ transform: translateY(-1px) scale(.998); }
    .card::after{
      content:""; pointer-events:none; position:absolute; inset:-20%;
      background:
        radial-gradient(700px 240px at 120% -10%, rgba(255,255,255,.5), transparent 60%),
        radial-gradient(500px 180px at -10% 120%, rgba(255,255,255,.35), transparent 60%);
      mix-blend-mode: screen;
    }

    .card__title{
      display:flex; align-items:center; gap:14px;
      font-size: clamp(22px, 3.2vw, 32px); font-weight:900; letter-spacing:.3px;
    }
    .card__title img{ width:56px; height:56px; object-fit:contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.12)); }
    .card__cta{ font-size:26px; font-weight:900; opacity:.75; }

    /* ===== Varianti colore (pastello) ===== */
    .card--fire{     background: var(--pastel-fire); }
    .card--water{    background: var(--pastel-water); }
    .card--grass{    background: var(--pastel-grass); }
    .card--electric{ background: var(--pastel-electric); }
    .card--psychic{  background: var(--pastel-psychic); }
    .card--steel{    background: var(--pastel-steel); }

    /* Usa i tuoi colori, schiariti con color-mix dove supportato */
    @supports (color: color-mix(in srgb, red, white)){
      .card--fire{     background: color-mix(in srgb, var(--fire) 28%, white); }
      .card--water{    background: color-mix(in srgb, var(--water) 28%, white); }
      .card--grass{    background: color-mix(in srgb, var(--grass) 28%, white); }
      .card--electric{ background: color-mix(in srgb, var(--electric) 28%, white); }
      .card--psychic{  background: color-mix(in srgb, var(--psychic) 28%, white); }
      .card--steel{    background: color-mix(in srgb, var(--steel) 28%, white); }
    }

    /* ===== Piccola sezione note (facoltativa) ===== */
    .note{
      margin-top:18px; color:#666; font-size:14px; text-align:center;
    }

    /* ===== Scrollbar soft ===== */
    ::-webkit-scrollbar { height:5px; width:5px; }
    ::-webkit-scrollbar-thumb { background:#00000033; border-radius:50px; }
  </style>
</head>
<body>

  <!-- Header (non blocca il rendering) -->
  <div id="header-placeholder"></div>

  <main>
    <!-- HERO -->
    <section class="hero" aria-label="Intro">
      <h1>AniMMUnity</h1>
      <p>Filtra, esplora e classifica Anime & Manga con un’interfaccia pulita e veloce.</p>
      <div class="hero-badges">
        <span class="badge">Ricerca rapida</span>
        <span class="badge">Card pulite</span>
        <span class="badge">Top list</span>
      </div>
    </section>

    <!-- NAVIGATION TILES (pastello + coerenza visiva) -->
    <section class="sections" aria-label="Navigazione principale">
      <!-- Anime List -->
      <a class="tile full" href="anime-list.html" aria-label="Vai a Anime List">
        <div class="card card--fire">
          <div class="card__title">
            <img src="assets/images/card/dex.svg" alt="" loading="lazy">
            Anime List
          </div>
          <div class="card__cta">→</div>
        </div>
      </a>

      <!-- Top Anime -->
      <a class="tile" href="top-anime.html" aria-label="Vai a Top Anime">
        <div class="card card--electric">
          <div class="card__title">
            <img src="assets/images/card/abilities.svg" alt="" loading="lazy">
            Top Anime
          </div>
          <div class="card__cta">→</div>
        </div>
      </a>

      <!-- Top Manga -->
      <a class="tile" href="top-manga.html" aria-label="Vai a Top Manga">
        <div class="card card--grass">
          <div class="card__title">
            <img src="assets/images/card/moves.svg" alt="" loading="lazy">
            Top Manga
          </div>
          <div class="card__cta">→</div>
        </div>
      </a>

      <!-- Manga List -->
      <a class="tile full" href="manga-list.html" aria-label="Vai a Manga List">
        <div class="card card--water">
          <div class="card__title">
            <img src="assets/images/card/bag.svg" alt="" loading="lazy">
            Manga List
          </div>
          <div class="card__cta">→</div>
        </div>
      </a>
    </section>

    <p class="note">Usiamo i tuoi colori originali, resi pastello per maggiore leggibilità e modernità.</p>
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script>
    // Carica header/footer; se falliscono, la pagina resta comunque fruibile
    fetch("header.html").then(r => r.ok ? r.text() : "").then(h => {
      document.getElementById("header-placeholder").innerHTML = h || "";
      const toggle = document.querySelector('.menu-toggle');
      const headerInner = document.querySelector('.header-inner');
      if (toggle && headerInner) toggle.addEventListener("click", () => headerInner.classList.toggle("active"));
    }).catch(()=>{});

    fetch("footer.html").then(r => r.ok ? r.text() : "").then(f => {
      document.getElementById("footer-placeholder").innerHTML = f || "";
    }).catch(()=>{});
  </script>
</body>
</html>
